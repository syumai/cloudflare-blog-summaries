title: Cloudflare OSで、Cloudflareの働き方を再構築する
slug: how-we-use-ai-with-cloudflare-os
sourceUrl: https://blog.cloudflare.com/how-we-use-ai-with-cloudflare-os/
wiki: ../docs/articles/2026-08-05-how-we-use-ai-with-cloudflare-os.md
questions:
  - q: 本記事の著者は誰ですか。
    choices:
      - Sam Rhea（Cloudflare チーフインフォメーションオフィサー）
      - Matthew Prince（Cloudflare CEO）
      - Phillip（Cloudflare OS製品紹介記事の著者）
      - Scott Roe-Meschke（WriteGuardの著者）
    answer: 0
    explanation: 記事は、Cloudflare チーフインフォメーションオフィサー（CIO）のSam Rhea氏による一人称の記事です。Wikiの冒頭メタデータを参照してください。

  - q: 記事冒頭で語られる、AI導入のきっかけとなった出来事は何ですか。
    choices:
      - 競合他社が同様のAI社内プラットフォームを発表したこと
      - 営業組織のメンバーがAIで"スーパーアプリ"を作るため、約12の本番システムへのアクセスとデプロイパイプラインの管理者権限を要求したこと
      - セキュリティインシデントによりAPIキーが漏えいしたこと
      - 全社員アンケートでAI活用の要望が最多だったこと
    answer: 1
    explanation: Wikiの「背景・課題」節にある通り、営業組織のメンバーが過大な権限（約12システムへの本番アクセスとデプロイパイプラインの管理者権限）を要求したエピソードから記事は始まります。

  - q: Cloudflareが直面していた「2つの相反する責務」とは何ですか。
    choices:
      - 開発速度を上げる責務と、コストを下げる責務
      - チームメンバーにAIツールを装備・有効化する責務と、システム・データを安全に保つ責務
      - 全社導入する責務と、パイロット導入にとどめる責務
      - オープンソース化する責務と、独自技術を守秘する責務
    answer: 1
    explanation: Wikiの「背景・課題」で述べられている通り、「装備・有効化する責務」と「安全に保つ責務」という2つの責務の両立が、Cloudflare OS構築の出発点でした。

  - q: 5つの基本原則のうち、「AI利用時のアクセス権」に関するものはどれですか。
    choices:
      - AIを使うためにAIを使わない
      - 全員が“超能力”を持つに値する
      - 出力の所有者は人間である
      - AI利用時にシステムに対する許可を増やすべきではない
    answer: 3
    explanation: Wikiの「発表内容 / アーキテクチャ」節にある原則5です。社員が既存の製品で持っているスコープされたデータアクセスの範囲を、AI利用時も超えてはならないという原則です。

  - q: エンジニア向けパイロット「Engineering Codex」の役割を最もよく表しているのはどれですか。
    choices:
      - してはいけないことを定めたポリシー文書
      - チームが従うべき原則・実践をまとめた、何をすべきかを示す権威あるガイド
      - コードレビューを完全に自動化し人間のレビューを不要にする仕組み
      - 全エンジニアの成果を評価するための人事評価基準
    answer: 1
    explanation: Wikiの「エンジニア向け：Engineering Codex」で説明されている通り、ポリシーが「してはいけないこと」を示すのに対し、Codexは「すべきこと」を示す権威あるガイドとして位置づけられています。

  - q: 「魔法のメールエイリアス」が生まれた背景として正しいものはどれですか。
    choices:
      - エンジニア向けハーネスをそのまま非エンジニアに与えたところ相性が悪く、代わりに定型業務をメールで依頼できる仕組みを用意した
      - 非エンジニアにもコマンドラインツールの使い方を教育する研修プログラムだった
      - メールセキュリティ強化のためのフィルタリング機能だった
      - 顧客からの問い合わせを自動分類するためのツールだった
    answer: 0
    explanation: Wikiの「非エンジニア向け：“魔法のメールエイリアス”」にある通り、エンジニア向けハーネスは非エンジニアの業務（1回限りの成果物作成や複数システム横断の仕事）と相性が悪く、代替として社員が「自動化したいがやりたくない仕事」をメールで送れる仕組みが作られました。

  - q: Cloudflare OS v1における技術的課題として本記事が挙げているものはどれですか。
    choices:
      - 同じ定型作業のたびにAIエージェントを再実行する必要があり、そのたびにトークンを消費していたこと
      - ブラウザからのアクセスができず、専用アプリのインストールが必要だったこと
      - Cloudflare Zero Trustによる認証が煩雑すぎたこと
      - MCPサーバーとの接続に対応していなかったこと
    answer: 0
    explanation: Wikiの「Cloudflare OS v2」節冒頭で述べられている通り、v1ではスキルファイルを実行するたびにトークン集約的な推論セッションが立ち上がる課題がありました。

  - q: Cloudflare OS v2で導入された考え方「AIは常にツールである必要はない」とは、具体的にどういうことですか。
    choices:
      - AIをすべての業務から排除し、人間の手作業に戻すこと
      - AIに毎回推論させるのではなく、AIエージェントに一度ワークフローを実現するコードを生成させ、以後はそのコードを決定論的に実行すること
      - AIモデルを常に最新・最高性能のものに更新し続けること
      - AIの利用をエンジニアだけに限定すること
    answer: 1
    explanation: Wikiの「Cloudflare OS v2」節にある通り、「AIは常にツールである必要はなく、ツールメーカーであればよい」という発想のもと、ワークフローを一度コード化し、以後はほぼトークンを消費せず決定論的に実行できるようにしています。

  - q: Sam Rhea氏自身のITヘルプデスク日次レポートの事例で、Cloudflare OS v2導入後の変化として正しいものはどれですか。
    choices:
      - レポート作成の頻度が週次から日次に増えた
      - 毎朝レポートを読み込む際のトークン消費が実質ゼロになった
      - レポート作成がすべて外部委託されるようになった
      - チケットシステム自体が刷新された
    answer: 1
    explanation: Wikiの「ITヘルプデスクの日次レポート作成」節にある通り、v2では一度コード化された仕組みが`gatekeeper`経由でデータに安全に接続するため、以後は毎朝のレポート読み込みでトークンをほぼ消費しなくなりました。

  - q: 直近1か月の展開成果として本記事が挙げている数値の組み合わせとして正しいものはどれですか。
    choices:
      - 営業チームで100時間削減、40アプリ作成
      - 営業チームで1万時間以上削減、4,000以上のアプリ・ツール作成
      - 全社で1,000時間削減、100アプリ作成
      - エンジニアリングチームのみで10万時間削減
    answer: 1
    explanation: Wikiの「展開・成果」節にある通り、直近1か月で営業チームだけで1万時間以上の削減、同期間に4,000以上のアプリ・ツールが社員により作成されました。
