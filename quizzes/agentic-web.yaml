title: "インターネットには「第二の読者」がいる: エージェントを迎え入れ、対価を得るためのレール"
slug: agentic-web
sourceUrl: https://blog.cloudflare.com/agentic-web/
wiki: ../docs/articles/2026-09-30-agentic-web.md
questions:
  - q: "記事が「第二の読者」と呼んでいるものはどれか。"
    choices:
      - "検索エンジンのクローラー"
      - "人の代わりに動くソフトウェアであるエージェント"
      - "広告を閲覧するモバイルユーザー"
      - "RSS リーダーの利用者"
    answer: 1
    explanation: "Wikiの「TL;DR」を参照。エージェントは人間でも従来のボットでもなく、広告には反応しないが背後に用事を抱えた人がいる存在として、第二の読者と呼ばれている。"

  - q: "記事が述べる、Cloudflare のネットワークでの変化として正しいものはどれか。"
    choices:
      - "今年初めて、トラフィックの半分以上が人間ではなくなった"
      - "人間のトラフィックが全体の 9 割を占め続けている"
      - "AI エージェント由来の日次リクエストは過去 1 年で 17% 増えた"
      - "平均リクエスト数は 2024 年末から変わっていない"
    answer: 0
    explanation: "Wikiの「TL;DR」を参照。平均リクエスト数は 6,300 万/秒から 1.15 億/秒に増え、エージェント由来の日次リクエストは 1,700% 以上増加し、今年初めて半分以上が人間ではなくなった。"

  - q: "記事が「1 リクエストあたりの収益が下がり、コストが上がる」原因として挙げているものはどれか。"
    choices:
      - "回答エンジンがページを読んで要約を返すため、帯域は使うが人間の訪問（広告や決済）が発生しない"
      - "人間の訪問者が増えすぎて CDN が不足している"
      - "検索エンジンがクロールをやめた"
      - "エージェントが常に有料プランを契約している"
    answer: 0
    explanation: "Wikiの「背景・課題」を参照。自動化リクエストは帯域・計算・オリジンの処理能力を消費するが、参照元も広告表示も購読もないものが増えている。"

  - q: "7 月に「AI ボットをブロック」の単一スイッチを置き換えた 3 つの個別制御はどれか。"
    choices:
      - "Read / Write / Delete"
      - "Search / Agent / Training"
      - "Allow / Challenge / Block"
      - "Free / Pro / Business"
    answer: 1
    explanation: "Wikiの「発表内容 / アーキテクチャ」の「2. 条件を決める」を参照。Free を含む全プランで使え、検索クローラーをブロックするサイトは 1% 未満、学習をブロックするサイトは 17% というデータが背景にある。"

  - q: "Disallow AI Training が解決しようとしている問題はどれか。"
    choices:
      - "検索と学習を兼ねる混在用途クローラーで、片方を断るともう片方も断ってしまう"
      - "エージェントの署名を偽造できてしまう"
      - "AI の回答に広告が表示されない"
      - "x402 の決済手数料が高い"
    answer: 0
    explanation: "Wikiの「2. 条件を決める」を参照。検索のインデックスを維持したまま、クローラー固有の仕組みで学習に使わないよう運営者に伝える。Apple・Google・Microsoft が順守を約束している。"

  - q: "Web Bot Auth は何を可能にするか。"
    choices:
      - "ボットの IP アドレスを一律にブロックする"
      - "運営者がエージェントのリクエストに暗号署名を付け、サイト側が本物と偽装を見分けられる"
      - "ボットの通信量を自動的に圧縮する"
      - "エージェントが人間として振る舞えるようにする"
    answer: 1
    explanation: "Wikiの「1. 誰が来ているかを見る」を参照。OpenAI、Google、AWS などが署名を付け、IP アドレスや user-agent 文字列からの推測を不要にする。検証済みボットのリクエストは毎週 5,000 億件超。"

  - q: "Pay Per Use の課金の考え方として正しいものはどれか。"
    choices:
      - "クロールのたびに一律で課金する"
      - "コンテンツが実際に使われたときに支払う。買い手は検証済みクローラーで、利用を報告する"
      - "出版社が AI 企業と個別に契約書を交わす"
      - "ユーザーが記事ごとに購読料を支払う"
    answer: 1
    explanation: "Wikiの「3. 対価を得る」の表を参照。クロールには課金せず、買い手が報告した利用を Cloudflare が検証して請求し、出版社に支払う。出版社はオプトイン/アウトを選べる。"

  - q: "Monetization Gateway が、価格の付いたリクエストに対してエージェントに返すものはどれか。"
    choices:
      - "HTTP 403 Forbidden"
      - "HTTP 429 Too Many Requests"
      - "オープンな x402 プロトコルによる HTTP 402 Payment Required"
      - "HTTP 301 Moved Permanently"
    answer: 2
    explanation: "Wikiの「3. 対価を得る」の表を参照。Rules 言語で価格を付け、ルールに一致したら 402 を返し、エージェントが売り手に直接支払う。現在はクローズドベータ（米国の該当する顧客）。"

  - q: "記事が、Pay Per Use と Monetization Gateway を別々に用意する理由として述べているものはどれか。"
    choices:
      - "すべての資産を同じ売り方にはできない。高価値コンテンツは買い手が識別され利用を報告する信頼ネットワークが要り、API や MCP ツールはリクエストごとが利用そのものだから"
      - "片方が廃止予定で、置き換えるため"
      - "Pay Per Use は API 専用で、Monetization Gateway は画像専用だから"
      - "法律上、2 つの製品に分ける必要があるため"
    answer: 0
    explanation: "Wikiの「3. 対価を得る」を参照。2 つは ID・計量・価格設定・決済・分析という共通のプリミティブの上に作られ、1 つのダッシュボードから組み合わせられる。"

  - q: "記事の結びで、Cloudflare が自らの立場として述べていることはどれか。"
    choices:
      - "一社がエージェントの発見・本人証明・支払いを握るのが最も効率的"
      - "x402 や Web Bot Auth などのオープン標準の上に作り、Cloudflare は選択肢の 1 つであって、スタック全体ではない"
      - "オープン標準は成熟しておらず、独自仕様を使う"
      - "ドメイン所有者は Cloudflare の決済のみ利用できる"
    answer: 1
    explanation: "Wikiの「なぜ Cloudflare 上で作るのか」を参照。ドメイン所有者は自分の ID プロバイダー、決済事業者、エージェントのパートナーを選べるとしている。"
