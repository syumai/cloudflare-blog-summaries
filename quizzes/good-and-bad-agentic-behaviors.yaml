title: "エージェンティック・インターネットにおける「良い振る舞い」と「悪い振る舞い」を見極める"
slug: good-and-bad-agentic-behaviors
sourceUrl: https://blog.cloudflare.com/ja-jp/good-and-bad-agentic-behaviors/
wiki: ../docs/articles/2026-08-07-good-and-bad-agentic-behaviors.md
questions:
  - q: >-
      記事における「リスク」と「信頼」の関係の説明として<strong>正しいもの</strong>はどれか。
    choices:
      - リスクと信頼は同じ1本の物差しの両端にあり、どちらかが上がればもう一方は必ず下がる
      - リスクは一時的な害の可能性を示す指標、信頼は評判に基づき時間をかけて積み上げる指標であり、互いに独立しながらも影響し合う
      - リスクと信頼はどちらもサイト運営者ではなくボット運営者だけが管理する指標である
      - 信頼は一時的な指標、リスクは時間をかけて積み上げる指標である
    answer: 1
    explanation: >-
      Wikiの「発表内容 / アーキテクチャ」内「リスクと信頼の定義」で説明されているとおり、Cloudflareはリスク（一時的で害の可能性を示す指標）と信頼（評判に基づき時間をかけて積み上げる指標）を、同じ物差しの両端ではなく独立しながらも影響し合う2軸として扱っている。夜間のチャイムのたとえ話も、この2軸の関係を示すために使われている。

  - q: >-
      記事で紹介されている <code>BotBase</code> の特徴として<strong>正しいもの</strong>はどれか。
    choices:
      - 良いボットの一覧のみを管理する、従来のBots Directoryと同じ仕組みである
      - 好ましくない振る舞いをするボットも継続的に追跡し、信頼を悪用したボットは検証済みステータスから外す
      - ボットの検証をすべて自動化し、人間の判断を一切介在させない仕組みである
      - AI Labyrinthの別名であり、ボットを迷路に誘導する機能そのものを指す
    answer: 1
    explanation: >-
      Wikiの「透明性に根ざした良い振る舞い」で述べているとおり、BotBaseは従来のBots Directory（良いボットの名簿）とは異なり、好ましくない振る舞いをするボットも継続的に追跡し、信頼を悪用したボットは検証済みステータスから外す仕組みである。

  - q: >-
      「Precursor」の説明として<strong>正しいもの</strong>はどれか。
    choices:
      - サーバー側のみで動作し、リクエストヘッダーだけを見て一時点で判定するシステムである
      - クライアント側で継続的に動作し、JavaScriptをCDN経由で自動挿入して、セッション全体を通じて振る舞いを評価するシステムである
      - AIモデルの学習データを汚染するための機能である
      - 良いボットの処理量をキューイングによって調整する機能である
    answer: 1
    explanation: >-
      Wikiの「悪い振る舞い: あからさまなものから巧妙なものまで」で説明されているとおり、Precursorはクライアント側で継続的に動作し、JavaScriptをCDN経由で自動挿入することで、ネットワークシグナルだけでは見逃される振る舞いをセッション全体にわたって評価する仕組みである。

  - q: >-
      記事が示す直近24時間のPrecursorの実績として<strong>正しいもの</strong>はどれか。
    choices:
      - 730ゾーンで実行され、約2万件の評価イベントを処理した
      - 73,438ゾーンで実行され、約2億600万件の評価イベントを処理した
      - 全世界のすべてのゾーンで無条件に実行され、評価イベント数は非公開である
      - Precursorはまだプレビュー版で、実運用の統計は存在しない
    answer: 1
    explanation: >-
      Wikiの「悪い振る舞い: あからさまなものから巧妙なものまで」に記載のとおり、記事は直近24時間で73,438ゾーンにおいてPrecursorが実行され、2億600万件の評価イベントを処理したという実績を示している。

  - q: >-
      Precursorの検出パターンから得られた気付きとして、記事の内容と<strong>異なるもの</strong>はどれか。
    choices:
      - 不審な振る舞いはセッションの開始時点だけでなく、途中で現れることが多い
      - 1つのセッションの中で人間→AIエージェント→人間へと主体が切り替わるハイブリッドトラフィックが存在する
      - サイト運営者はトラフィックの「意図」を理解することが重要である
      - 不審な振る舞いは必ずセッションの開始時点で発生するため、最初のリクエストだけを検査すれば十分である
    answer: 3
    explanation: >-
      Wikiの「悪い振る舞い: あからさまなものから巧妙なものまで」で述べられているとおり、記事はむしろ「不審な振る舞いはセッション途中で発生することが多く、特定時点の検出では不十分」と指摘している。選択肢Dはこの内容と正反対であり誤り。

  - q: >-
      「Adaptive Intelligence」が従来のBots MLと異なる点として、記事の説明にもっとも近いものはどれか。
    choices:
      - バージョン単位でモデルを更新する方式を維持しつつ、更新頻度を週1回に短縮しただけである
      - モデル自体が変化に適応し、観測データに基づいて継続的に学習・自動調整を行うことで、正式リリースを待たずに最新の検出を利用できる
      - 検出処理をすべてクライアント側で完結させ、サーバー側の処理を廃止する仕組みである
      - 良いボットのみを対象とし、悪いボットの検出には使われない仕組みである
    answer: 1
    explanation: >-
      Wikiの「Adaptive Intelligenceが近日登場」で説明されているとおり、従来のBots MLはバージョン単位の更新であり、数時間〜数分で適応するボットに追いつけないという課題があった。Adaptive Intelligenceはモデル自体が継続的に学習・自動調整することで、正式な新モデルのリリースを待たずに最新の予測検出を利用できるようにする。

  - q: >-
      記事が指摘する「ボットの抗生物質問題」とは何か。
    choices:
      - ボット対策に医療分野のAIモデルを転用すると精度が落ちる問題
      - ボットに対して常に決まった応答（一律の403ブロックなど）を返し続けると、悪意のあるボット開発者がその反応を観察して防御の仕組みをリバースエンジニアリングできてしまう問題
      - 抗生物質のようにボットを無害化する薬剤的な技術が存在しないという問題
      - サーバーのCPU資源が抗生物質の生産ラインのように不足する問題
    answer: 1
    explanation: >-
      Wikiの「決定論的な手法を超え、ボットの振る舞いに働きかける」で説明されているとおり、常に同じ応答を返す決定論的な対応は、悪意のあるボット開発者にリバースエンジニアリングされやすい。これを抗生物質の乱用による耐性菌の発生になぞらえて「抗生物質問題」と呼んでいる。

  - q: >-
      AI Labyrinthの3つのオプションのうち、「偽の価格・在庫情報などを提供し、AI学習用に収集されるデータへ誤った情報を混入させる」機能はどれか。
    choices:
      - Maze
      - Summary
      - Poison
      - Queueing
    answer: 2
    explanation: >-
      Wikiの「決定論的な手法を超え、ボットの振る舞いに働きかける」に記載のとおり、Mazeはリンクを無限生成してボットを巡回させる機能、Summaryは役に立たないLLM生成要約を提供する機能、Poisonは偽の価格・在庫情報などでAI学習データに誤情報を混入させる機能である。Queueingは記事内の対策アプローチの1つだが、AI Labyrinthのオプションではない。

  - q: >-
      記事が挙げる「良いボットのキューイング」という対策の目的として、もっとも適切なものはどれか。
    choices:
      - ショッピングエージェントのような正当な自動トラフィックを完全に拒否し、サイトへのアクセスを一切許可しないため
      - 正当な自動トラフィックを完全拒否せず、処理量を調整することでアクセスを維持しつつ負荷をコントロールするため
      - すべてのボットを例外なくAI Labyrinthに誘導するため
      - Precursorの評価処理そのものを高速化するため
    answer: 1
    explanation: >-
      Wikiの「決定論的な手法を超え、ボットの振る舞いに働きかける」で述べられているとおり、良いボットのキューイングは、ショッピングエージェントのような正当な自動トラフィックを完全に拒否するのではなく、処理量を調整することでアクセスを維持しつつ負荷をコントロールする対策である。

  - q: >-
      記事全体の結論・提案として、もっとも適切なものはどれか。
    choices:
      - すべての自動トラフィックを一律にブロックすることが、もっとも安全なボット対策である
      - 特定の時点だけを調べる静的なチェックから、セッション全体を通じた継続的な信頼評価へ移行することで、次々に現れるボット運営者への場当たり的な対応を減らせる
      - ボット対策はAI Labyrinthだけで十分であり、Precursorのような検出の仕組みは不要である
      - リスクと信頼は将来的に1つの指標に統合される予定であり、現時点では区別する意味がない
    answer: 1
    explanation: >-
      Wikiの「発表内容 / アーキテクチャ」末尾（自分に合った信頼のエコシステムを構築する）で述べられているとおり、記事の結論は、静的な一時点チェックから継続的な信頼評価への移行によって、次々に現れる新しいボット運営者への場当たり的な対応を減らせるという点にある。Precursorの有効化・Precursor Traceの試用・BotBaseの確認が、その具体的な第一歩として挙げられている。
