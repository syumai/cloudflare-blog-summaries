title: "Cloudflare OS: 会社のエージェントワークスペースを、マネージドで提供"
slug: managed-cloudflare-os
sourceUrl: https://blog.cloudflare.com/managed-cloudflare-os/
wiki: ../docs/articles/2026-10-01-managed-cloudflare-os.md
questions:
  - q: "この記事で新たに案内された、Cloudflare OS の提供形態はどれか。"
    choices:
      - "ブラウザ拡張機能として配布される個人向け版"
      - "フルマネージド版（ウェイトリスト）"
      - "オンプレミス向けのアプライアンス版"
      - "Workers の無料プランに自動で組み込まれる機能"
    answer: 1
    explanation: "Wikiの「TL;DR」と「発表内容 / アーキテクチャ」の「フルマネージド版（ウェイトリスト）」を参照。フルマネージド版の Cloudflare OS のウェイトリストが開始された。"

  - q: "フルマネージド版を立ち上げる際に、利用者が指定すると記事で説明されている組み合わせはどれか。"
    choices:
      - "リージョン・インスタンスサイズ・データベース名"
      - "カスタムドメイン・Cloudflare Access ポリシー・接続する AI Gateway"
      - "GitHub のリポジトリ名・ブランチ名・デプロイ先"
      - "料金プラン・請求先・サポートレベル"
    answer: 1
    explanation: "Wikiの「発表内容 / アーキテクチャ」の「フルマネージド版（ウェイトリスト）」を参照。カスタムドメイン、適用する Access ポリシー、接続する AI Gateway を指定すれば、残りは Cloudflare が担当する。"

  - q: "オープンソース版を自分の Cloudflare アカウントにデプロイする場合、記事が指摘している課題はどれか。"
    choices:
      - "機能が制限されていて、エージェントを動かせない"
      - "誰かがデプロイの設定・運用・更新を担当する必要がある"
      - "ライセンス上、社内利用が認められない"
      - "Google Workspace とは接続できない"
    answer: 1
    explanation: "Wikiの「背景・課題」と「フルマネージド版」を参照。オープンソース版は完全な制御権を持てる一方、設定・運用・更新を担当する人が必要になる。"

  - q: "この 1 か月で追加された「Git リポジトリのマウント」で、エージェントができるようになったこととして正しいものはどれか。"
    choices:
      - "GitLab のみに接続し、読み取り専用で閲覧する"
      - "既存の GitHub リポジトリを接続し、コードの探索・修正・コミット・push・PR 作成を行う"
      - "リポジトリの削除と、組織の課金設定の変更を行う"
      - "コードを書くことはできるが、既存のコードは変更できない"
    answer: 1
    explanation: "Wikiの「発表内容 / アーキテクチャ」の「Git リポジトリのマウントとコードの操作」を参照。既存の GitHub リポジトリを接続し、ファイルの検索・編集、コミット作成、GitHub への push、PR の作成ができる。"

  - q: "Git リポジトリのマウントが追加される前の Cloudflare OS について、記事の説明として正しいものはどれか。"
    choices:
      - "ソフトウェア開発以外の作業に焦点を当てており、エージェントは既存の Git リポジトリのコードを扱えなかった"
      - "Git リポジトリのみを対象にしており、ドキュメント作成はできなかった"
      - "コードを一切生成できなかった"
      - "Git の代わりに独自のバージョン管理を使っていた"
    answer: 0
    explanation: "Wikiの「Git リポジトリのマウントとコードの操作」を参照。当初はドキュメント・スライド・自動化・共同作業ツールなど、ソフトウェア開発以外の作業に焦点を当てていた。エージェントはアプリのコードは書けたが、既存リポジトリのコードは扱えなかった。"

  - q: "Google Workspace の Gatekeeper の説明として、記事の内容に合っているものはどれか。"
    choices:
      - "Google のデータセンター内で動く物理的なゲートウェイ"
      - "Cloudflare OS と外部サービスの間に入る、サービス固有の Worker"
      - "Gmail の迷惑メールを自動で削除するフィルター"
      - "Google アカウントのパスワードを保管するボールト"
    answer: 1
    explanation: "Wikiの「Google Workspace をまたいだ作業」を参照。Gatekeeper は、Cloudflare OS と外部サービスの間に位置するサービス固有の Worker で、今回 Google Workspace 向けのものが改善された。"

  - q: "Google Workspace 連携の強化によって、Cloudflare OS ができるようになったこととして、記事に挙げられていないものはどれか。"
    choices:
      - "Gmail のスレッドを読んで調査する"
      - "下書きを作成し、メールを送信する"
      - "Drive 全体、特定のフォルダ、個別のドキュメントやシートを接続する"
      - "Google Workspace の管理者アカウントを新規に作成する"
    answer: 3
    explanation: "Wikiの「Google Workspace をまたいだ作業」を参照。Gmail の読み取り・調査、下書き作成、送信、Drive の接続は挙げられているが、管理者アカウントの作成には触れられていない。"

  - q: "エクスポート形式について、記事の説明と合っているものはどれか。"
    choices:
      - "Word (.docx) と PowerPoint (.pptx) を含むすべての形式が、すでに利用可能"
      - "xlsx・CSV・PDF・Markdown・HTML が利用可能で、Word と PowerPoint は近日対応予定"
      - "PDF のみ対応しており、他の形式は予定されていない"
      - "エクスポートは組み込み機能のみで、ツールが独自の形式を定義することはできない"
    answer: 1
    explanation: "Wikiの「使い慣れた形式へのエクスポート」を参照。Excel (.xlsx)・CSV・PDF・Markdown・HTML に対応し、Word (.docx) と PowerPoint (.pptx) は近日対応予定。ツール自身が独自のエクスポート形式を定義することもできる。"

  - q: "記事で、ツールが独自のエクスポート形式を持てる例として挙げられているのはどれか。"
    choices:
      - "スケジュールをカレンダーファイル（.ics）としてダウンロードできるようにする"
      - "データベースを SQL ダンプとして書き出す"
      - "コードを ZIP 形式に圧縮する"
      - "画像を PNG に変換する"
    answer: 0
    explanation: "Wikiの「使い慣れた形式へのエクスポート」を参照。「このスケジュールをカレンダーファイル（.ics）としてダウンロードできるようにして」とエージェントに伝えると、ツールのエクスポートメニューにその選択肢が追加される。"

  - q: "マネージド版を選んだ場合でも組織側に残る判断として、Wikiの「所感・ポイント」で整理されているものはどれか。"
    choices:
      - "サーバーのパッチ適用のタイミング"
      - "誰が使えるか・どの組織文脈を使うか・どこに到達できるか・どの AI Gateway を使うか"
      - "データセンターの設置場所"
      - "Workers ランタイムのバージョン"
    answer: 1
    explanation: "Wikiの「所感・ポイント」を参照。運用作業は Cloudflare に任せつつ、アクセス・組織のスキルとコンテキスト・到達できるシステム・AI Gateway といった統制に関わる決定権は組織側に残る。"
