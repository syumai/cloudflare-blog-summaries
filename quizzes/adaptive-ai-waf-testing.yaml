title: "フロンティア AI モデルで自社の WAF をテストしてみた: 分かったこと"
slug: adaptive-ai-waf-testing
sourceUrl: https://blog.cloudflare.com/adaptive-ai-waf-testing/
wiki: ../docs/articles/2026-09-29-adaptive-ai-waf-testing.md
questions:
  - q: "この記事のテストで LLM に与えられた役割として最も適切なものはどれか。"
    choices:
      - "ソースコードを静的解析して脆弱性を探す監査役"
      - "ハッカーのように振る舞い、WAF がきちんと防御するかを動的に評価するテスター"
      - "WAF ルールを直接書き換える管理者"
      - "ログを要約するだけの分析役"
    answer: 1
    explanation: "Wikiの「背景・課題」を参照。今回は動的なアプローチで、LLM を攻撃者のように動かして WAF が役目を果たしているかを評価した。"

  - q: "LLM（提案・レビューの両呼び出し）に渡されなかった情報はどれか。"
    choices:
      - "直近の試行結果の短い履歴"
      - "レスポンスのステータスと選択したヘッダー"
      - "WAF のルール式、ルール ID、Attack Score の詳細"
      - "リクエストの文脈"
    answer: 2
    explanation: "Wikiの「適応ループの仕組み」を参照。どちらの呼び出しも WAF の内部情報（ルール式・ルール ID・Attack Score の詳細・動作した層）は受け取らない。"

  - q: "テスト結果の規模として、記事の内容と合っているものはどれか。"
    choices:
      - "45 シナリオ、1,107 回の試行、ブロック 558 件、人間レビュー後の所見 49 件"
      - "6 シナリオ、45 回の試行、ブロック 1,107 件、所見 558 件"
      - "100 シナリオ、10,000 回の試行、所見 0 件"
      - "45 シナリオ、1,107 件のすべてがブロックされた"
    answer: 0
    explanation: "Wikiの「結果と、所見の数え方」を参照。トリアージ後の結果セット 607 は、ブロック 558 件 + WAF 関連の所見 49 件である。"

  - q: "所見 49 件のうち、ほとんど（48 件）を占めたカテゴリはどれか。"
    choices:
      - "XSS と SQLi"
      - "LFI と Log4j"
      - "CMDi と SSRF"
      - "ログ・インジェクションのみ"
    answer: 2
    explanation: "Wikiの「結果と、所見の数え方」を参照。XSS・LFI・SQLi・Log4j はほぼ全面的にカバーされ、所見は CMDi と SSRF に集中した。"

  - q: "記事のテストにおけるコード側（LLM ではなく）の安全対策として正しいものはどれか。"
    choices:
      - "モデルが直接リクエストを送り、結果だけをコードが記録する"
      - "送信前にホスト名を許可リストで検査し、リダイレクトを無効化し、試行上限を強制する"
      - "モデルが WAF ルールを自動デプロイする"
      - "レスポンス本文はすべて信頼できる入力として次のプロンプトへそのまま渡す"
    answer: 1
    explanation: "Wikiの「適応ループの仕組み」の安全面の設計を参照。モデルは直接送信せず、ルールのデプロイもできない。レスポンスの文章は信頼できない入力として扱う。"

  - q: "次の SSRF セッションの抜粋で、試行 18 の結果として正しい説明はどれか。"
    code: |
      ベースライン: 169.254.169.254   → 403 ブロック
      試行 1:       2852039166         → ブロック（10 進整数）
      試行 2:       0251.0376.0251.0376 → ブロック（8 進、フォーム本文）
      試行 17:      10 進整数ホスト     → ブロック
      試行 18:      169.254.169.254.   → リダイレクト
    codeLang: text
    choices:
      - "メタデータが取得でき、SSRF の成功が確認された"
      - "WAF のブロックではなくリダイレクトが返った。検知の隙間の手がかりとして保存したが、メタデータ取得の証拠ではない"
      - "Attack Score が 30 を超えたため自動で許可された"
      - "末尾ドットは無効な表記なのでエラーになった"
    answer: 1
    explanation: "Wikiの「1 つのセッションでの適応の例（SSRF）」とコード例を参照。末尾ドット形式がリダイレクトとなり edge-pass として保持されたが、オリジンからの成功応答やメタデータ取得の証拠はない。"

  - q: "ブロックされなかった要求を所見として数える前の問いに「含まれない」ものはどれか。"
    choices:
      - "有効なリクエストを実際に送ったか"
      - "その挙動は WAF の責任範囲か"
      - "エンジニアが安全に再現できるか"
      - "モデルが自信を持って説明できたか"
    answer: 3
    explanation: "Wikiの「結果と、所見の数え方」の 5 つの問いを参照。モデルの説明は仮説であり、正しさの証明ではない。判断基準は有効性・明確な非ブロック・悪意の維持・WAF の責任範囲・再現性。"

  - q: "この取り組みが貢献した Managed Ruleset の変更として正しいものはどれか。"
    choices:
      - "SSRF - Obfuscated Host と SSRF - Restricted Protocol の新規検知、および SSRF - Cloud の改善"
      - "XSS ルールの全削除"
      - "Log4j 検知の無効化"
      - "OWASP Core Ruleset の廃止"
    answer: 0
    explanation: "Wikiの「所見から検知へ」を参照。前 2 つは 7 月 21 日のリリース、SSRF - Cloud の改善は 8 月 4 日のリリース。Obfuscated Host は非標準の数値形式で内部アドレスをエンコードした要求から生まれた。"

  - q: "記事が「学んだこと」として述べている内容として正しいものはどれか。"
    choices:
      - "1 つのシナリオの試行回数を延ばすほど、比例して所見が増えた"
      - "モデルのバージョンが違うと、まったく異なる問題しか見つからなかった"
      - "開始リクエスト・攻撃カテゴリ・入力位置を増やすほうが、1 つの系列を延ばすよりカバレッジが広がった"
      - "人間のレビューなしでもすべてのブロックされなかった要求が所見になった"
    answer: 2
    explanation: "Wikiの「学んだこと」を参照。25 回の上限の終盤には以前のアイデアの繰り返しが見られた。また同系列のモデルの 2 バージョンで、変異は違っても同じ根本的な問題が現れた。レビューなしでは所見はゼロだった。"

  - q: "顧客向けの助言として、記事が述べている内容はどれか。"
    choices:
      - "WAF さえ有効にすれば、アプリのパッチ適用は不要になる"
      - "Managed Rules をまずログで動かし、Security Events で確認してからブロックに移す。多層防御とパッチ適用を併用する"
      - "本番環境で攻撃的なテストを直接実行すべき"
      - "Attack Score は無効にして、OWASP Core Ruleset のみを使う"
    answer: 1
    explanation: "Wikiの「顧客ができること」を参照。WAF をすり抜けても脆弱なアプリがなければ攻撃は成立しないが、パッチ適用は最強の防御の 1 つで、ポジティブセキュリティなどを含む多層防御も勧められている。"
