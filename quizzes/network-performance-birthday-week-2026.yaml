title: "2026 Birthday Week: ネットワーク性能アップデート"
slug: network-performance-birthday-week-2026
sourceUrl: https://blog.cloudflare.com/network-performance-birthday-week-2026/
wiki: ../docs/articles/2026-10-02-network-performance-birthday-week-2026.md
questions:
  - q: "記事によると、Cloudflare は上位1,000ネットワークのうち何%で最速のプロバイダーになったか。"
    choices:
      - "60%"
      - "74%"
      - "88%"
      - "95%"
    answer: 1
    explanation: "Wikiの「TL;DR」を参照。2026年8月時点で74%。Agents Week（4月）の60%から14ポイント改善した。"

  - q: "記事で、プロバイダーの速さを測る指標として使われているものはどれか。"
    choices:
      - "ページ全体の読み込み完了時間"
      - "TCP ハンドシェイクが完了するまでの接続時間"
      - "DNS の応答時間のみ"
      - "1秒あたりのリクエスト処理数"
    answer: 1
    explanation: "Wikiの「測定方法」を参照。距離・経路・混雑を反映しつつ「速い体験」に近いとして、接続時間を使っている。"

  - q: "順位付けに使われる「トリミアン」の説明として正しいものはどれか。"
    choices:
      - "最小値と最大値の平均"
      - "25・50・75 パーセンタイルの加重平均"
      - "全サンプルの単純平均"
      - "99 パーセンタイルの値"
    answer: 1
    explanation: "Wikiの「測定方法」の表を参照。トリミアンは外れ値の影響を抑えつつ、多くのユーザーの体験の幅を表せる。"

  - q: "従来から使われている測定の入口はどれか。"
    choices:
      - "Cloudflare ブランドのエラーページ"
      - "Workers のログ"
      - "メールの開封ログ"
      - "DNS のクエリログのみ"
    answer: 0
    explanation: "Wikiの「測定方法」を参照。2021年から、エラーページに到達したユーザーのブラウザが、各プロバイダーの軽量ファイルを取得して測定してきた。"

  - q: "今回新たに追加された測定の仕組みはどれか。"
    choices:
      - "Challenge Pages 上で動く、非対話のバックグラウンド計測"
      - "ユーザーに速度テストのボタンを押してもらう方式"
      - "サーバー間の ping のみの測定"
      - "ブラウザ拡張機能による計測"
    answer: 0
    explanation: "Wikiの「新しい測定: Challenge Pages」を参照。訪問者が画面にいる間、固定のエンドポイントから軽量ファイルを取得し、完了有無と所要時間を記録する。"

  - q: "Challenge Pages での測定の現在の展開範囲として正しいものはどれか。"
    choices:
      - "すべての Challenge Pages で常時実施している"
      - "対象となる無料プランの Challenge Pages のごく一部で実施している"
      - "有料プランのみで実施している"
      - "まだ内部テストの段階で、一般の訪問者には実施していない"
    answer: 1
    explanation: "Wikiの「新しい測定: Challenge Pages」を参照。データが品質を高め、性能に影響しないと確認できた場合にのみサンプリング率を上げる。"

  - q: "Challenge Pages を測定に使う主な利点として、記事が挙げているものはどれか。"
    choices:
      - "測定対象のプロバイダーを減らせること"
      - "ユーザーの追加操作なしに、より多くのネットワークから多様なデータを集められること"
      - "測定結果を Cloudflare だけに有利にできること"
      - "Turnstile の検証を省略できること"
    answer: 1
    explanation: "Wikiの「Challenge Pages の到達範囲が測定を拡張する」を参照。到達範囲の広さがデータの量と多様性を高める。"

  - q: "上位プロバイダーの差が 1〜2ms の場合に、測定量を増やす意義として最も適切なものはどれか。"
    choices:
      - "ミリ秒単位の差を無視できる"
      - "トリミアンの信頼区間が狭まり、本当の優位と統計的なノイズを区別しやすくなる"
      - "すべてのネットワークで順位が必ず入れ替わる"
      - "接続時間以外の指標を使う必要がなくなる"
    answer: 1
    explanation: "Wikiの「さらなる可能性と順位の安定化」を参照。僅差のネットワークで順位が日ごとに入れ替わる問題を、サンプル増で解消できる。"

  - q: "記事の数値を読む際の注意として、Wikiの「所感・ポイント」で述べられているものはどれか。"
    choices:
      - "74% はユーザー数で重み付けした値である"
      - "74% はネットワーク数ベースの割合で、改善には手法変更で順位が安定した分も含まれうる"
      - "74% は Cloudflare 以外の第三者機関が算出した値である"
      - "74% は国数ベースの割合である"
    answer: 1
    explanation: "Wikiの「所感・ポイント」を参照。74% は上位1,000ネットワークのうち最速となったネットワークの割合。記事は人数による重み付けを今後の可能性としている。"
