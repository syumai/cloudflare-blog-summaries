title: "Webはどれくらい速いのか: BEACON で数十億件の実ユーザー計測を探索する"
slug: how-fast-is-the-web
sourceUrl: https://blog.cloudflare.com/how-fast-is-the-web/
wiki: ../docs/articles/2026-09-28-how-fast-is-the-web.md
questions:
  - q: "BEACON データセットの説明として正しいものはどれか。"
    choices:
      - "Cloudflare ネットワーク上の大規模サイト1万件の匿名化済み実ユーザー計測データで、Google BigQuery に毎日更新される"
      - "合成テストで計測したベンチマーク結果を月次で公開する CSV ファイル"
      - "Cloudflare Workers の実行時間を記録したログ"
      - "全世界のあらゆるサイトを網羅した、非匿名のアクセスログ"
    answer: 0
    explanation: "Wikiの「発表内容 / アーキテクチャ」の「BEACON データセットの概要」を参照。大規模サイト1万件の RUM を匿名化し、BigQuery に毎日更新する。"

  - q: "BEACON が提供する Core Web Vitals の3指標の組み合わせとして正しいものはどれか。"
    choices:
      - "TTFB・FCP・TBT"
      - "LCP・CLS・INP"
      - "LCP・FID・TTI"
      - "CLS・TTFB・INP"
    answer: 1
    explanation: "Wikiの「TL;DR」と「発表内容 / アーキテクチャ」を参照。LCP（読み込み）、CLS（視覚的安定性）、INP（応答性）を提供する。"

  - q: "指標を平均値ではなくヒストグラムで公開することの利点として、記事が述べているものはどれか。"
    choices:
      - "データ容量が小さくなる"
      - "個人が識別されなくなる"
      - "任意のパーセンタイルを導出でき、P75 を超えたロングテールまで分析できる"
      - "計測のたびに自動で P75 が改善する"
    answer: 2
    explanation: "Wikiの「BEACON データセットの概要」を参照。ヒストグラムから任意のパーセンタイルを得られ、P75 で止まらずロングテールを確認できる。"

  - q: "BEACON の規格面の位置づけとして正しいものはどれか。"
    choices:
      - "Cloudflare 独自の非公開規格"
      - "W3C が管理する公式仕様そのもの"
      - "コミュニティ主導の RUM Archive の規格に準拠し、そのフットプリントを100倍に拡大する"
      - "Google Analytics のデータ形式"
    answer: 2
    explanation: "Wikiの「TL;DR」を参照。RUM Archive の規格に沿い、そのフットプリントを100倍に拡大する。"

  - q: "記事の WebKit と Blink の比較結果として正しいものはどれか。"
    choices:
      - "WebKit はすべての国で Blink より大幅に遅い"
      - "WebKit は全体では最良だが、WebKit が10%超を占める46か国では LCP・INP の一方または両方が Blink 系より10%以上悪い"
      - "WebKit と Blink に差はない"
      - "WebKit は Android で唯一のエンジンである"
    answer: 1
    explanation: "Wikiの「誰がより遅いウェブを体験しているか」を参照。カンボジアでは WebKit が17.5%を占め、LCP は Blink より50%悪い。"

  - q: "LCP のサブパーツ分析で、記事が「体感の読み込み時間への寄与が最も小さい」としているのはどれか。"
    choices:
      - "リソース（画像・フォント・動画）自体のダウンロード"
      - "LCP 候補の発見"
      - "描画のブロック解除"
      - "HTML ドキュメントの TTFB"
    answer: 0
    explanation: "Wikiの「ページが遅く感じる原因: サブパーツ分析」を参照。Good を外れる多くのページビューで大きな改善余地があるのは、LCP 候補の発見と描画のブロック解除。"

  - q: "記事が示した INP サブパーツの傾向として正しいものはどれか。"
    choices:
      - "Input Delay が最も長く、他は無視できる"
      - "最も遅い操作では JavaScript の実行（Processing Time）が最長で、Presentation Delay も大きく伸びる"
      - "すべてのサブパーツが同じ比率で増える"
      - "Presentation Delay は常に0に近い"
    answer: 1
    explanation: "Wikiの「INP のサブパーツ」を参照。Poor 帯で Processing Time は 284ms、Presentation Delay は 217ms。後者は複雑な CSS レイアウト再計算が多い。"

  - q: "ハードナビゲーションとソフトナビゲーションの比較から読み取れる内容として正しいものはどれか。"
    choices:
      - "ソフトナビゲーションはどのパーセンタイルでも2〜3倍速いが、初回ランディングは重く、ランディング以降に進まないユーザーが多いと回収できない"
      - "ソフトナビゲーションは P95 でのみ速い"
      - "ソフトナビゲーションは常にハードより遅い"
      - "初回ランディングはソフトナビゲーションより軽い"
    answer: 0
    explanation: "Wikiの「アプリケーションアーキテクチャによる違い」を参照。Soft の P50 は 274ms、Hard は 791ms。ランディングページの P50 は 1,370ms。"

  - q: "IQI と転送サイズの比較で、記事が意外な点として挙げた観察と、その扱いとして正しいものはどれか。"
    choices:
      - "ヨーロッパの転送サイズが最も小さく、原因は CDN の設定だと断定している"
      - "アフリカの転送サイズが目立って小さい。ネットワーク制約への最適化の可能性があるが、原因は断定していない"
      - "すべての大陸で転送サイズが同じで、サイトが同一だからだと断定している"
      - "帯域幅が高いほど LCP が遅いと断定している"
    answer: 1
    explanation: "Wikiの「データを組み合わせる: GDP・IQI・転送サイズ」を参照。記事は原因を断定せず、最適化や高品質ネットワークの寛容さなどを仮説として挙げている。"

  - q: "BEACON のデータ処理の説明として正しいものはどれか。"
    choices:
      - "ドメインは残すが URL パスだけ削除する。全サイトを等しく含める"
      - "ドメイン・URL パスを削除し、上位1万サイトに絞って正規化し、データ点が5件未満のレコードは破棄する"
      - "個人情報を含めたまま研究者にのみ限定公開する"
      - "最小サイトの量にすべてのサイトを揃える"
    answer: 1
    explanation: "Wikiの「データ処理とプライバシー」を参照。全サイトだと大手に偏り、最小サイトに揃えるとレコードが激減するため、1万サイトが選ばれた。"
