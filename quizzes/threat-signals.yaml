title: "Threat Signals のご紹介: オープンソース脅威インテリジェンスのためのエージェント型スキル"
slug: threat-signals
sourceUrl: https://blog.cloudflare.com/threat-signals/
wiki: ../docs/articles/2026-09-29-threat-signals.md
questions:
  - q: "Threat Signals が主に処理の対象とするものはどれか。"
    choices:
      - "ユーザーが選んだオープンソースの脅威レポート（RSS フィード）"
      - "Cloudflare のネットワーク全体の HTTP ログ"
      - "社内の従業員の端末ログ"
      - "DNS クエリの圧縮データ"
    answer: 0
    explanation: "Wikiの「TL;DR」「発表内容 / アーキテクチャ」を参照。Threat Signals は、ユーザーが選んだオープンソースの報告を要約・タグ付けし、IOC を抽出して使える形にする。"

  - q: "記事が説明する「スキル」として最も適切なものはどれか。"
    choices:
      - "ブラウザ拡張機能の一種"
      - "経験豊富なアナリストが作業をどう進めるかを記した詳細な指示のまとまりで、どのレポートでも同じ手順で実行される"
      - "WAF のルールセットの名称"
      - "Cloudflare Workers のバインディングの種類"
    answer: 1
    explanation: "Wikiの「発表内容 / アーキテクチャ」の「スキルとは」を参照。スキルは専門家の手順を再現可能な形にしたもので、毎回同じ手順で実行できる。"

  - q: "全 Cloudflare アカウントで無料になる内容として、記事に書かれているものはどれか。"
    choices:
      - "RSS フィード無制限と無期限のデータ保存"
      - "RSS フィード 1 本の選択と、最長 30 日保存の非公開データセット、Threat Events Platform への API・ダッシュボードアクセス"
      - "カスタムスキルの生成とカスタム WAF ルールの作成"
      - "Cloudforce One の独自脅威インテリジェンスデータセット"
    answer: 1
    explanation: "Wikiの「全アカウント向けの提供内容」を参照。複数フィード、独自データセット、カスタムスキル、カスタム WAF ルールなどは Essentials / Advantage / Elite の Enterprise 向けの拡張。"

  - q: "Threat Signals が RSS フィードの記事本文を取得・整形する際に使うものはどれか。"
    choices:
      - "Browser Run の Markdown クイックアクション"
      - "Email Routing"
      - "Cloudflare Tunnel"
      - "Hyperdrive"
    answer: 0
    explanation: "Wikiの「仕組み」を参照。Workflow が定期的にポーリングし、Browser Run の Markdown クイックアクションで本文を取得して整形し、R2 に保存する。"

  - q: "抽出された指標（IOC）の保存先と、その後の使い方として正しいものはどれか。"
    choices:
      - "公開データベースに登録され、全ユーザーに共有される"
      - "アカウント専用の非公開データセットに Threat Event として保存され、WAF ポリシーに適用できる"
      - "ローカルの CSV にのみ出力される"
      - "メールで管理者へ送られるだけで保存はされない"
    answer: 1
    explanation: "Wikiの「仕組み」を参照。各指標はアカウント専用の非公開 Threat Signals データセット内の脅威イベントに裏付けられ、脅威イベントから WAF ルールを作成できる。"

  - q: "開発チームが「AI のタグ付けをアカウントの既存タグカタログに限定した」理由はどれか。"
    choices:
      - "AI が新しいタグを作れない技術的制約があったから"
      - "見慣れない語彙でラベル付けされると、2 つの語彙を突き合わせる手間が増えて使いにくくなるから"
      - "タグの数を減らして課金を抑えるため"
      - "Enterprise 向けの機能を区別するため"
    answer: 1
    explanation: "Wikiの「設計上の学び」の「語彙の一貫性」を参照。顧客チームから、未知の語彙のインテリジェンスは使いにくいという指摘があり、既存のタグカタログに限定した。"

  - q: "アナリストが初期テストで繰り返し戻ってきた機能として、記事が挙げているものはどれか。"
    choices:
      - "要約文の長さの調整"
      - "イベントと、その元になったレポートとのリンク"
      - "ダッシュボードの配色の変更"
      - "フィードの並べ替え"
    answer: 1
    explanation: "Wikiの「設計上の学び」の「イベントと元レポートのリンク」を参照。要約は最初に目に入るが、アナリストが調査で各指標がなぜ重要かを追うために、このリンクに戻ってきた。"

  - q: "タグが自動で付いたのかアナリストが付けたのかを記録することについて、記事の説明として正しいものはどれか。"
    choices:
      - "監査のためだけの不要なメタデータだった"
      - "地味に見えて必須だった。どのタグが自動で付いたか分かると、自動タグ付けへの信頼が高まった"
      - "自動付与のタグは常に手動タグより優先される"
      - "手動のタグは削除される"
    answer: 1
    explanation: "Wikiの「設計上の学び」の「付与元の透明性」を参照。自動か手動かの記録は小さなメタデータに見えるが、アナリストの信頼に直結した。"

  - q: "従来の手作業中心のワークフローで、数週間後に起きがちな問題として記事が挙げているものはどれか。"
    choices:
      - "ドメインがブロックリストに入っているが、誰も理由を分からなくなる"
      - "RSS フィードが自動的に削除される"
      - "WAF が全通信を遮断する"
      - "証明書の有効期限が切れる"
    answer: 0
    explanation: "Wikiの「背景・課題」を参照。指標が TIP に入れられても文脈から切り離されるため、後でなぜブロックしているのかが分からなくなる。Threat Signals は文脈を保つ点が特徴。"

  - q: "今後の予定として記事が述べているものはどれか。"
    choices:
      - "RSS フィードのサポートを終了する"
      - "RSS 以外にも、より多くのデータ取り込みパイプラインに対応する"
      - "無料枠を廃止する"
      - "スキルの利用を Enterprise のみに限定する"
    answer: 1
    explanation: "Wikiの「今後」を参照。アナリストがさまざまな形式・パイプラインの情報を取り込めるよう、RSS 以外の取り込みパイプラインの追加が予告されている。"
