title: "1年後のソブリンAIと「選択」をめぐる戦い: 欧州の2つのオープンモデルを Workers AI に、AI防御ワークショップも開始"
slug: sovereign-ai-choice-one-year-later
sourceUrl: https://blog.cloudflare.com/sovereign-ai-choice-one-year-later/
wiki: ../docs/articles/2026-10-01-sovereign-ai-choice-one-year-later.md
questions:
  - q: "この記事で Workers AI に追加されると発表された、欧州発の 2 つのオープンモデルはどれか。"
    choices:
      - "EuroLLM と Apertus"
      - "Mistral と Llama"
      - "Kimi と GLM"
      - "IndicTrans2 と Sarashina"
    answer: 0
    explanation: "Wikiの「TL;DR」と「発表内容 / アーキテクチャ」の「欧州の 2 つのオープンモデルを Workers AI へ」を参照。EU 公用語 24 言語を含む EuroLLM と、スイスの完全オープンモデル Apertus である。"

  - q: "記事が前年（2025 年）の主張として振り返っている、AI ソブリンティへの Cloudflare の答えはどれか。"
    choices:
      - "すべてのモデルを自国内で学習し、国外モデルを遮断すること"
      - "選択: 適切な道具を選び、必要なら乗り換える自由"
      - "フロンティアモデルのみを使うこと"
      - "オープンモデルの利用を制限すること"
    answer: 1
    explanation: "Wikiの「背景・課題」を参照。前年の答えは「選択」で、記事は壁を築くゼロサムの発想に反論している。"

  - q: "Apertus の説明として、記事の内容に合っているものはどれか。"
    choices:
      - "EU 公用語 24 言語のみに対応し、重みは非公開"
      - "スイス初の大規模・完全オープンな多言語モデルで、1,500 以上の言語を扱い、アーキテクチャ・重み・学習データ・手法を公開している"
      - "日本で開発された日本語特化モデル"
      - "Cloudflare が自社 GPU のみで学習した商用モデル"
    answer: 1
    explanation: "Wikiの「発表内容 / アーキテクチャ」の表を参照。ETH Zurich・EPFL・CSCS による Swiss AI Initiative のモデルで、15 兆トークン超・1,500 以上の言語、学習データの 40% が英語以外。"

  - q: "記事の「What people built last year」で紹介された、日本のプロトタイプはどれか。"
    choices:
      - "Form Mitra"
      - "MedBridge"
      - "Anshin Concierge"
      - "Geneva Concierge"
    answer: 2
    explanation: "Wikiの「昨年のモデルで人々が作ったもの」を参照。Form Mitra はインド、MedBridge はシンガポール、Anshin Concierge は日本（東京都の支援窓口へ 1 タップで案内）。"

  - q: "Form Mitra が提供する機能として、記事の説明に合っているものはどれか。"
    choices:
      - "22 のインド言語で音声ガイドしながら、給付などの書類記入を支援する"
      - "インドの株式市場の価格予測を行う"
      - "東南アジア 14 言語で看護記録を自動作成する"
      - "東京都の窓口に電話で自動予約する"
    answer: 0
    explanation: "Wikiの「昨年のモデルで人々が作ったもの」を参照。IIT デリーの学生が CyberPeace とのビルダソンで作り、AI4Bharat の IndicTrans2 を使っている。"

  - q: "記事でいう「ハーネス」の説明として正しいものはどれか。"
    choices:
      - "GPU を 1 台に束ねるハードウェア"
      - "複数の AI モデルを並列に動かし、脆弱性の探索・検証・優先度付けを調整するオーケストレーション層"
      - "Workers AI のモデルを課金する仕組み"
      - "オープンモデルの学習データを匿名化するツール"
    answer: 1
    explanation: "Wikiの「1 つのモデルに依存しない AI 防御」を参照。クローズド／オープンを問わず任意のモデルで動くため、1 つのプロバイダーを失っても防御が止まらない。"

  - q: "記事が「1 つのモデルに依存した防御」を問題視する理由として最も適切なものはどれか。"
    choices:
      - "そのモデルのコストが常に高いから"
      - "そのモデルへのアクセスが予告なく制限される可能性があり、防御がそのアクセスに左右されるから"
      - "オープンモデルは脆弱性を見つけられないから"
      - "防御側はフロンティアモデルを使えないから"
    answer: 1
    explanation: "Wikiの「1 つのモデルに依存しない AI 防御」を参照。脆弱性を見つけるフロンティアモデルは防御側にも使えるが、重要モデルへのアクセスが予告なく制限される事態を政府は見てきた、と記事は述べる。"

  - q: "新たに始まるハンズオンワークショップの対象と初回の開催として、記事の内容に合っているものはどれか。"
    choices:
      - "個人開発者向け、11 月にサンフランシスコ"
      - "政府のサイバーセキュリティ機関と重要インフラ事業者向け、10 月にシンガポール（Singapore International Cyber Week）"
      - "学生向け、来年 6 月にジュネーブ"
      - "大企業の営業担当者向け、オンラインのみ"
    answer: 1
    explanation: "Wikiの「1 つのモデルに依存しない AI 防御」の最後の部分を参照。参加者は自分の AI セキュリティハーネスと多層防御を構築する。"

  - q: "本リポジトリの Wiki が、この記事について「サンプル対象外」と判断している理由として最も適切なものはどれか。"
    choices:
      - "記事に Python のコードが載っているため"
      - "中心がアクセス申請制のモデル追加と政策・ワークショップの発表で、一般利用可能で最小実装により再現できる機能ではないため"
      - "Workers AI は Workers 上で動作しないため"
      - "wrangler が非対応のため"
    answer: 1
    explanation: "Wikiの「コード例」と「所感・ポイント」を参照。記事にコード例は無く、2 モデルはアクセス申請制である。"

  - q: "記事全体の結論として、最も近いものはどれか。"
    choices:
      - "ソブリンティを守るには、国外モデルをすべて遮断すべきである"
      - "選択は AI ソブリンティへの道であり、AI セキュリティへの道でもある"
      - "AI セキュリティはフロンティアモデル 1 つに集中すべきである"
      - "オープンモデルは防御に使えない"
    answer: 1
    explanation: "Wikiの「TL;DR」と「所感・ポイント」を参照。記事の最後は「1 年前は選択が AI ソブリンティへの道だと述べた。今年は AI セキュリティへの道でもあると示した」と結ばれている。"
