title: "Cloudflare K2 のご紹介: サーバーレスなイベントストリーム"
slug: cloudflare-k2-streams
sourceUrl: https://blog.cloudflare.com/cloudflare-k2-streams/
wiki: ../docs/articles/2026-10-01-cloudflare-k2-streams.md
questions:
  - q: "Cloudflare K2 は、Developer Platform 上のどのようなプリミティブか。"
    choices:
      - "SQL でクエリできるリレーショナルデータベース"
      - "永続的なイベントストリーミング（順序付きログ）のプリミティブ"
      - "グローバルに複製されるキーバリューストア"
      - "コンテナを実行するための実行環境"
    answer: 1
    explanation: "Wikiの「TL;DR」と「発表内容 / アーキテクチャ」の「K2 とは」を参照。K2 はイベントを順序付きのログとして保存する、永続的なイベントストリーミングのプリミティブである。"

  - q: "K2 の内部実装として、記事が説明しているものはどれか。"
    choices:
      - "Apache Kafka のクラスタをエッジに展開している"
      - "Durable Objects だけで全データをメモリ上に保持している"
      - "R2 オブジェクトストレージの上に実装したパーティション化された永続ログ"
      - "D1 のテーブルに 1 行ずつ追記している"
    answer: 2
    explanation: "Wikiの「発表内容 / アーキテクチャ」の「K2 とは」を参照。K2 は R2 の上にパーティション化された永続ログを実装しており、大量のストレージにスケールできる。"

  - q: "K2 が最初に必要とされた理由として、記事が挙げているものはどれか。"
    choices:
      - "Workers の課金データを保存するため"
      - "Basin Pipelines の取り込み層となる、エッジ上の永続バッファが必要だったため"
      - "Queues を置き換えるため"
      - "ブラウザ向けのリアルタイム通知のため"
    answer: 1
    explanation: "Wikiの「エッジ上のストリーム: なぜ R2 の上に作ったか」を参照。Pipelines はイベントを受け付けたら落とさないと約束しており、その保管先となる永続バッファとして K2 が作られた。"

  - q: "R2 のようなオブジェクトストアの上にログを作るときの課題と、K2 の対処の組み合わせとして正しいものはどれか。"
    choices:
      - "追記に対応していないため、書き込みをメモリに蓄積し、セグメントファイルとして書く"
      - "削除ができないため、古いオブジェクトを手動で消す運用にする"
      - "強い一貫性がないため、別途の合意サービスを置く"
      - "ファイルサイズに上限があるため、1 イベントを 1 ファイルとして書く"
    answer: 0
    explanation: "Wikiの「オブジェクトストレージ上でログを作る方法」を参照。オブジェクトストアは追記に非対応のため、エッジのサービスでメモリに蓄積し、少し待ってからセグメントとして書く。順序付けとオフセットは R2 のアトミックな操作で実現する。"

  - q: "R2 の上に作ったことによる、記事が述べるトレードオフはどれか。"
    choices:
      - "データの耐久性が下がる"
      - "produce のレイテンシが大きくなる（初期リリースで p99 約 1 秒）"
      - "コンシューマーが 1 つしか持てない"
      - "長期保持ができない"
    answer: 1
    explanation: "Wikiの「オブジェクトストレージ上でログを作る方法」を参照。オブジェクトストレージへの書き込みはローカルディスクより遅く、バッチが溜まるのも待つため、99 パーセンタイルで約 1 秒の produce レイテンシになる。"

  - q: "Queues・Basin Pipelines・K2 の使い分けとして、記事の説明に合うものはどれか。"
    choices:
      - "Queues は長期保持とファンアウト、K2 は個々の作業項目のリトライ向け"
      - "最終的に R2 や Iceberg テーブルへ書くなら Pipelines、カスタム処理や他の宛先なら K2、作業項目単位のリトライや DLQ が必要なら Queues"
      - "3 製品は同じ機能なので、どれを選んでも違いはない"
      - "K2 は R2 への書き込みにしか使えない"
    answer: 1
    explanation: "Wikiの「Streams, Queues, Pipelines の使い分け」の表を参照。Queues は作業項目単位のリトライ・遅延・DLQ、Pipelines は R2 / Iceberg への書き込み、K2 は高スケールのデータ移動・長期保持・ファンアウトやカスタム処理に向く。"

  - q: "次のコードの `result.error.retryable` の使われ方として正しい説明はどれか。"
    code: |
      const result = await env.EVENTS.send([
        {
          content: new TextEncoder().encode(
            JSON.stringify({ event: "page_view" }),
          ),
          headers: { "content-type": "application/json" },
        },
      ]);
      if (!result.success) {
        console.error(`Produce failed: ${result.error.message}`);
        return new Response("Failed to record event", {
          status: result.error.retryable ? 503 : 500,
        });
      }
    codeLang: ts
    choices:
      - "再試行可能なエラーなら 503、そうでなければ 500 を返す"
      - "再試行可能なエラーなら自動的に最大 3 回リトライする"
      - "再試行可能なエラーなら 500、そうでなければ 503 を返す"
      - "再試行可能かどうかによらず常に 500 を返す"
    answer: 0
    explanation: "Wikiの「コード例」の「2. Worker バインディングから produce する」を参照。`result.error.retryable` が true なら 503（再試行を促す）、false なら 500 を返している。K2 はデータをバイト列として扱うため、`content` は TextEncoder で変換している。"

  - q: "consume で取得したバッチについて、記事の説明に合うものはどれか。"
    choices:
      - "リースは 5 分間で、コンシューマーは ack・nack・リース延長のいずれかを行える"
      - "取得すると同時に自動で ack され、再配信されない"
      - "リースはなく、複数のコンシューマーが同じバッチを同時に処理する"
      - "nack すると、そのメッセージは永久に削除される"
    answer: 0
    explanation: "Wikiの「始め方: ストリーム・サブスクリプション・消費」を参照。取得したバッチには 5 分間のリースが付き、ack（処理済み・再配信なし）、nack（再配信を依頼）、リース延長の 3 つのどれかを行う。"

  - q: "同じストリームを複数のコンシューマーが「それぞれすべてのメッセージ」を受け取りたい場合、記事が示す読み出し方式はどれか。"
    choices:
      - "1 つのサブスクリプションを全員で共有する"
      - "コンシューマーごとに別のサブスクリプションを作る（pub/sub パターン）"
      - "ストリームを複製して別アカウントに置く"
      - "nack を使って全員に再配信する"
    answer: 1
    explanation: "Wikiの「始め方: ストリーム・サブスクリプション・消費」の読み出し方式を参照。1 つのサブスクリプションを分け合うと各コンシューマーはデータの一部を受け取る。各自が全メッセージを見るには、コンシューマーごとに別のサブスクリプションを作る。"

  - q: "K2 のパブリックベータの提供条件・制限として、記事に合うものはどれか。"
    choices:
      - "全アカウントが対象で、上限はなく、最初から課金される"
      - "Workers Paid のアカウント向けで、保存量 10GB・1 ストリーム 30 MB/s の上限があり、ベータ中は課金されない"
      - "Enterprise 契約のみが対象で、保存量は無制限"
      - "Workers Free のアカウントのみが対象で、課金は GB あたり $1"
    answer: 1
    explanation: "Wikiの「料金と提供状況」を参照。Workers Paid のアカウント向けに、最大 10GB の保存と 1 ストリーム 30 MB/s の produce という上限付きで提供され、ベータ中は課金されない。課金開始後の想定は produce・consume が $0.04 / GB、保持が $0.02 / GB / 月。"
