title: "1年後の振り返り: 1.1.1.1 人のインターンが生んだ力"
slug: one-year-later-1111-interns
sourceUrl: https://blog.cloudflare.com/one-year-later-1111-interns/
wiki: ../docs/articles/2026-10-05-one-year-later-1111-interns.md
questions:
  - q: "「1,111」という採用目標の数字は、何にちなんだものか。"
    choices:
      - "Cloudflare の創業年"
      - "公開 DNS リゾルバー 1.1.1.1"
      - "Birthday Week の開催回数"
      - "インターンの応募者数"
    answer: 1
    explanation: "Wikiの「TL;DR」を参照。1.1.1.1 は Cloudflare の公開 DNS リゾルバーで、目標の数字はその名前への言及（nod）とされている。"

  - q: "記事が述べる、このプログラムの賭けの前提として最も近いものはどれか。"
    choices:
      - "AI が普及するので、早期キャリア人材の採用は不要になる"
      - "AI によって、早期キャリア人材はより価値が高まり、より早く影響を出せる"
      - "インターンは短期間のため、社内業務の補助に限るのが望ましい"
      - "AI ツールを使わせないほうが、インターンの学習が進む"
    answer: 1
    explanation: "Wikiの「TL;DR」と「背景・課題」を参照。AI は学習・試行・難しい問題への挑戦を助けるが、新しい人のエネルギー・好奇心・新鮮な視点は補えない、という立場である。"

  - q: "記事時点での実績として正しい組み合わせはどれか。"
    choices:
      - "1,111 件を達成し、採用を終了した"
      - "750 件のインターンシップ、48 チーム、9 拠点。目標に向けて進行中"
      - "750 チーム、48 件のインターンシップ、9 拠点"
      - "111 件のインターンシップ、11 チーム、1 拠点"
    answer: 1
    explanation: "Wikiの「発表内容 > 規模」を参照。記事は「まだ 1,111 に向けて取り組んでおり、採用も続けている」と述べている。"

  - q: "記事が示す、インターンの仕事の範囲に関する説明として正しいものはどれか。"
    choices:
      - "エンジニアリング職に限られ、非エンジニアリング職は対象外"
      - "エンジニアリングにとどまらず、内部監査・プロダクト管理・People・サポートなどにも及ぶ"
      - "製品開発には関与せず、社内イベントの運営が中心"
      - "各インターンは、既存のドキュメントの整理のみを担当する"
    answer: 1
    explanation: "Wikiの「発表内容 > 仕事の範囲」を参照。内部監査の ISO 統制のテスト自動化、Startup Program のクレジット管理の近代化、新入社員の身元確認の改善、サポートの AI 活用などが挙げられている。"

  - q: "記事が述べる、インターンの AI の使い方の位置づけとして最も近いものはどれか。"
    choices:
      - "学習や責任を省くための近道"
      - "スタートラインを前に進める道具。方向づけやレビューはマネージャーとメンターが担い続ける"
      - "マネージャーのレビューを不要にする仕組み"
      - "採用人数を増やす代わりに、個々の育成を減らす手段"
    answer: 1
    explanation: "Wikiの「発表内容 > AI ネイティブなインターン」を参照。AI は近道ではなく、全体像の把握を数週間から数日にするなど、難しい問いに時間を使えるようにするものとされ、マネージャーとメンターは方向づけと判断のレビューを担った。"

  - q: "Cache Transcoding の説明として正しいものはどれか。"
    choices:
      - "オリジンの画像を AI で別形式に変換して配信する機能"
      - "主要プロキシ内で、適格なアセットを Zstandard で圧縮してからディスクへ書き込み、初期テストでディスク上のサイズを平均で元の 3 分の 1 に縮小した"
      - "DNS の応答を圧縮してデータセンター間の通信を減らす機能"
      - "キャッシュの有効期限を自動で延長する機能"
    answer: 1
    explanation: "Wikiの「発表内容 > インターンが出荷したもの」の表を参照。RAM とディスクの価格が上昇する中、既存サーバーから多くのキャッシュ容量を得る目的で、インターンの Aashi が構築した。"

  - q: "インターンの Iliana の BGP に関する取り組みとして、記事の説明に合うものはどれか。"
    choices:
      - "BGP の経路リークを AI で自動修復するツールを作った"
      - "ORIGIN 属性の書き換えを計測し、観測した経路の約 70% で確認、経路選択から ORIGIN を外すことを提唱した"
      - "BGP を廃止して、新しいルーティングプロトコルを設計した"
      - "RFC 9234 の仕様そのものを策定した"
    answer: 1
    explanation: "Wikiの「発表内容 > インターンが出荷したもの」の表を参照。あわせて、経路リークをルーター自身が拒否できるようにする RFC 9234 の採用状況も追跡した。"

  - q: "記事が「ポスト量子」の取り組みで述べている理由として、正しいものはどれか。"
    choices:
      - "2029 年の目標があるため。見えないものは移行できないので、まず暗号の利用を可視化する"
      - "量子コンピューターが既に実用化されたため、全暗号を即時に停止する"
      - "ポスト量子暗号は、Cloudflare だけが利用できる技術のため"
      - "可視化は顧客に提供せず、社内用途に限る"
    answer: 0
    explanation: "Wikiの「発表内容 > インターンが出荷したもの」の表を参照。Tiago が社内ツール CryptoLabe の構築を支援し、Sophie が Logpush・Log Explorer・HTTP Traffic Analytics の接続ごとの可視化を支援した。顧客が自分で進捗を確認できる点も述べられている。"

  - q: "記事から読み取れる、このインターンプログラムの設計上の特徴として、最も適切なものはどれか。"
    choices:
      - "専用の練習用プロジェクトで、本番とは切り離して実施する"
      - "稼働中のチームに初日から加わり、全員が何かを残すことを期待され、成果を公開記事として書く場面もある"
      - "成果の発表は社内に限り、外部には公開しない"
      - "インターンの人数が増えたため、メンターを置かない方針に切り替えた"
    answer: 1
    explanation: "Wikiの「ユースケース」と「発表内容」を参照。初日から実際の問題に取り組み、製品改善・プロセス・インフラ・知見のいずれかを残すことが期待され、今年はインターン自身が Birthday Week の記事を書いた。メンターとマネージャーの支援も継続している。"
