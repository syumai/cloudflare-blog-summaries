title: ID情報に基づく分析で、不正なAIの利用を検出
slug: identity-aware-ai-gateway
sourceUrl: https://blog.cloudflare.com/ja-jp/identity-aware-ai-gateway/
wiki: ../docs/articles/2026-08-05-identity-aware-ai-gateway.md
questions:
  - q: 本記事で発表された2つの機能の組み合わせとして正しいものはどれですか。
    choices:
      - Identity-aware AI Gateway と User Insights
      - WriteGuard と Gatekeeper
      - Cloudflare Access と Cloudflare Workers
      - AI Gateway と Cloudflare Computer
    answer: 0
    explanation: WikiのTL;DRにある通り、Cloudflare AccessとAI Gatewayを連携するIdentity-aware AI Gatewayと、行動パターンを分析するUser Insightsの2つが本記事の中心テーマです。

  - q: スタンフォード大学の調査によれば、責任あるAIガバナンスの最大の障害として「知識不足」を挙げた組織の割合はどれですか。
    choices:
      - 25%
      - 41%
      - 59%
      - 83%
    answer: 2
    explanation: Wikiの「背景・課題」節に記載の通り、スタンフォード大学の調査では59%の組織が「責任あるAIガバナンスの最大の障害は知識不足」と回答しています。

  - q: Identity-aware AI Gatewayによって、AI Gatewayへのリクエストに付与されるメタデータは何ですか。
    choices:
      - cf.session_id
      - cf.user_id
      - cf.model_id
      - cf.request_hash
    answer: 1
    explanation: Wikiの「Identity-aware AI Gateway」節にある通り、Cloudflare Accessで確認済みのユーザーIDが `cf.user_id` というリクエストメタデータとして付与され、ユーザー単位でのログ・分析・料金集計が可能になります。

  - q: Identity-aware AI Gatewayが解決する、従来の「共有APIキー」運用の課題として本記事が挙げていないものはどれですか。
    choices:
      - 誰がAIサービスを利用しているのか把握できない
      - 従業員向けの既存アクセスルールを適用できない
      - クライアントごとに個別の認証システムを構築する必要がある
      - AIモデルの推論速度が遅くなる
    answer: 3
    explanation: Wikiの「Flexportの声」で語られている課題は「誰が使っているか把握できない」「既存アクセスルールを適用できない」「クライアントごとの認証システム構築が必要」であり、推論速度の低下は本記事のテーマではありません。

  - q: User Insightsが個々のリクエストではなくセッション単位で利用状況を評価するのはなぜですか。
    choices:
      - セッション単位の方がデータ量が少なく処理が軽いため
      - 人間とエージェントで利用パターンの規則性が異なり、固定しきい値では両者の違いを正しく判断できないため
      - セッションIDの方がリクエストIDより取得が容易なため
      - 法規制でリクエスト単位の分析が禁止されているため
    answer: 1
    explanation: Wikiの「User Insights：行動パターンからの異常検知」節にある通り、エージェントは規則的、人間は不規則な利用パターンになりやすく、同じ変化でも意味が異なるため、セッション単位でアカウント自身の履歴と比較する設計になっています。

  - q: User Insightsが異常判定の基準として使う、そのアカウント自身の「普段の利用量」の算出方法はどれですか。
    choices:
      - 過去7日間の平均コスト
      - 過去30日間のセッションコストのp95（95パーセンタイル）
      - 直近1回のセッションコスト
      - 組織全体の平均コスト
    answer: 1
    explanation: Wikiの「基準値の作り方」節にある通り、過去30日間のセッションコストのp95を基準値とし、セッションコストがその2倍を超えると異常の可能性が高いと判断します。

  - q: 図1（セッションコストの異常検知）で、実際にアラート対象となる領域はどれですか。
    choices:
      - ユーザー自身の基準値（2× User p95）とアカウント全体のp99の両方を超える右上の領域
      - ユーザー自身の基準値のみを超える左上の領域
      - セッションコストが高いが普段からその水準の右下の領域
      - どちらの基準も超えない左下の領域
    answer: 0
    explanation: Wikiの「図1の4象限」で説明されている通り、ユーザー基準値とアカウント全体のp99の両方を超える右上（★印）の領域のみがアラート対象です。左上や右下は不要なアラートを避けるため対象外とされています。

  - q: 図2（アカウント全体のセッションコスト分布）で、なぜp99（99パーセンタイル）を併用するのですか。
    choices:
      - p99の方がp95より計算が簡単だから
      - 特定ユーザーの利用増加だけでなく、組織全体で見ても上位1%に入るほど高額なセッションであることを異常判定の条件にするため
      - p99を超えるとシステムが自動的に課金停止するため
      - p99は法律で定められた基準値だから
    answer: 1
    explanation: Wikiの「図2」節で説明されている通り、アカウント全体のp99を「絶対的なコスト上限」として併用することで、特定ユーザーの相対的な増加だけでなく、組織全体で見た希少性も条件に加えています。

  - q: User Insightsの役割について、本記事の説明として正しいものはどれですか。
    choices:
      - 異常と判定したセッションを自動的にブロックする
      - 利用者の意図を判断し、悪意の有無を自動で確定する
      - 通常パターンから外れた少数のアカウントを管理者に提示し、管理者が状況を確認できるようにする
      - すべてのユーザーの利用履歴を毎日メールで送信する
    answer: 2
    explanation: Wikiの「User Insightsの役割の境界」節にある通り、User Insightsは意図の判断や自動ブロックは行わず、通常パターンから外れたアカウントを管理者に提示するだけの機能です。

  - q: 今後の展開として本記事が挙げている、AIの「利用目的」を自動で見分けるための開発中の機能はどれですか。
    choices:
      - タスクベースのスマートルーティング
      - プロンプト分類機能（「コーディング」「文章作成」等への自動分類）
      - リアルタイム音声翻訳機能
      - モデルの自動再学習機能
    answer: 1
    explanation: Wikiの「今後の展開」節にある通り、リクエストを「コーディング」「文章作成」などのカテゴリに自動分類するプロンプト分類機能が開発中であり、いつもと異なるカテゴリでの急増を見分けやすくすることを目指しています。
