title: "AI でポスト量子移行の進路を描く: 社内ツール CryptoLabe による暗号利用の発見"
slug: ai-driven-cryptography-discovery
sourceUrl: https://blog.cloudflare.com/ai-driven-cryptography-discovery/
wiki: ../docs/articles/2026-09-29-ai-driven-cryptography-discovery.md
questions:
  - q: "CryptoLabe は何のために作られた社内ツールか。"
    choices:
      - "顧客のサイトの TLS 設定を外部から診断する"
      - "社内のコードベースから暗号の利用を洗い出し、ポスト量子移行の進路を描く"
      - "証明書を自動で発行する"
      - "量子コンピュータの性能を測る"
    answer: 1
    explanation: "Wikiの「TL;DR」と「背景・課題」を参照。製品・エンジニアリングチームが暗号の使われ方と更新方法を理解し、進捗指標を出し、前提条件を早期に見つけるために、AI でコードベースの暗号利用を発見するツールである。顧客には提供されない。"

  - q: "Cloudflare が完全なポスト量子（PQ）対応の目標としている年はどれか。"
    choices:
      - "2027 年"
      - "2029 年"
      - "2031 年"
      - "2035 年"
    answer: 1
    explanation: "Wikiの「背景・課題」を参照。2029 年を目標に、PQ 暗号化だけでなく PQ 認証も含めて「PQ everything」の方針で進めている。"

  - q: "記事が、暗号の発見を単純な grep で行うと起きる問題として挙げていないものはどれか。"
    choices:
      - "使われていないコードを拾って過大に数える"
      - "既定値や依存・設定経由の間接利用を見逃して過小に数える"
      - "ECDSA 署名が JWT・IPsec・TLS・SSH のどれで使われているか分からない"
      - "grep がリポジトリのコードを書き換えてしまう"
    answer: 3
    explanation: "Wikiの「問題の規模」を参照。過大・過小に数える問題と、使われ方が分からない問題が挙げられている。grep がコードを書き換えるという記述はない。"

  - q: "CryptoLabe の 2 段階のスキャンの説明として正しいものはどれか。"
    choices:
      - "1 段階目の発見で生の観測を集め、2 段階目の分析で観測ごとに再確認・使われ方の調査・自己レビューを行い、分類を付ける"
      - "1 段階目で分類を確定し、2 段階目はレポートの書式を整えるだけ"
      - "1 段階目で人間が手作業で暗号を探し、2 段階目でモデルが要約する"
      - "1 段階目は PQ の鍵交換、2 段階目は PQ の署名を別々に探す"
    answer: 0
    explanation: "Wikiの「2 段階のスキャン」を参照。発見段階が「生の観測」を作り、分析段階が観測ごとにソースで再確認し、実行時の使われ方や依存を調べ、設定の上書きやテスト専用コードなど欠けた証拠や矛盾する証拠を探して結論を見直す。"

  - q: "証拠が足りず分類を付けられないとき、CryptoLabe のモデルはどうするか。"
    choices:
      - "最も可能性の高い分類を推測して付ける"
      - "その発見を破棄する"
      - "More evidence needed、External dependency、Unknown のいずれかを付ける"
      - "常に Classical encryption として扱う"
    answer: 2
    explanation: "Wikiの「2 段階のスキャン」を参照。推測せず、証拠が足りないことを分類として表す設計になっている。"

  - q: "RS256 や ES256 の JWT が多数見つかったため、CryptoLabe で専用に設けられた分類はどれか。"
    choices:
      - "Classical token"
      - "PQ-ready"
      - "Classical encryption"
      - "PQ-ready hybrid key exchange"
    answer: 0
    explanation: "Wikiの「分類（現時点）」の表を参照。古典の RSA・ECDSA 署名を使う JWT を Classical token とし、ML-DSA を使う PQ の置き換えは RFC 9964 が定義している。"

  - q: "CryptoLabe の構成で、多数のスキャンが同時に走ってモデル呼び出しが HTTP 429 になる問題への対策として記事が述べているものはどれか。"
    choices:
      - "モデルの呼び出しを 1 日 1 回に制限する"
      - "スキャンごとに別のモデルを使う"
      - "再試行を含む全スキャンのモデルリクエストの間隔を調整する単一のグローバル Durable Object を置き、クールダウンを共有する"
      - "429 が返ったスキャンを自動的に中止する"
    answer: 2
    explanation: "Wikiの「大規模なモデル呼び出し」を参照。各スキャンが独立に再試行するとバーストが悪化したため、グローバル Durable Object で間隔を調整し、どれかが制限に当たると全スキャンが一斉に待つようにした。"

  - q: "モデルにリポジトリのコードを読ませるとき、CryptoLabe がコードベースを壊すリスクを避けて再現性を保つために行っていることはどれか。"
    choices:
      - "本番のリポジトリに直接書き込み権限を与える"
      - "スキャン開始時に正確なコミットのスナップショットを R2 に保存し、短命の Sandbox に復元して、読み取り専用ツールだけで扱わせる"
      - "コードを外部のモデル提供者へ送って解析させる"
      - "リポジトリを毎回最新のブランチで取得し直す"
    answer: 1
    explanation: "Wikiの「スキャンのオーケストレーション」を参照。リポジトリを正確なコミットで 1 度だけ取得して R2 に保存し、各 Workflow が新しい Cloudflare Sandbox に復元する。モデルは小さな読み取り専用ツール群で、イミュータブルなスナップショットを扱う。"

  - q: "記事が「難しいケース（hard cases）」の探索について述べている内容として正しいものはどれか。"
    choices:
      - "リポジトリ別の通常のスキャンだけで十分に見つかる"
      - "普通の TLS など一般的な利用を無視する別のプロンプトを、社内のチケットやドキュメントの文脈とともに全リポジトリに対して一括で走らせたほうが良い結果になった"
      - "難しいケースは AI では見つけられないため、人間が手作業で探している"
      - "難しいケースは PQ 署名が小さいために発生する"
    answer: 1
    explanation: "Wikiの「難しいケース（hard cases）」と教訓を参照。手法ごとに見つかるものが違い、いずれの発見もシステムを知るエンジニアの確認が必要とされている。なお PQ 署名は古典のものより大きいため、ヘッダーで証明書を運ぶ例のようにサイズ想定が壊れうる。"

  - q: "記事が、多くの組織に勧めている PQ 移行の進め方として正しいものはどれか。"
    choices:
      - "まず全リポジトリの暗号を網羅的に棚卸ししてから、移行を始める"
      - "重要なシステムのリポジトリを 1 つ選んで暗号の発見を行い、担当チームが結果を検証して、優先順位をつけて進める"
      - "PQ の標準がすべて確定するまで何もしない"
      - "CryptoLabe を購入して導入する"
    answer: 1
    explanation: "Wikiの「自組織の PQ 移行をどう考えるか」を参照。網羅的な棚卸しは行動の前提条件ではなく、現時点では資源の無駄と述べられている。通信の保護（Cloudflare 経由の PQ 暗号化など）を補完的な統制として使いつつ、リポジトリを選ぶ→発見→検証→優先順位づけ、の順に進める。CryptoLabe は顧客に提供されない。"
