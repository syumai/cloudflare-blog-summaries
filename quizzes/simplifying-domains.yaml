title: "人とエージェントのためにドメイン購入をシンプルに: 新しいドメイン検索と Registrar"
slug: simplifying-domains
sourceUrl: https://blog.cloudflare.com/simplifying-domains/
wiki: ../docs/articles/2026-09-30-simplifying-domains.md
questions:
  - q: "新しい Cloudflare Registrar のドメイン検索が、入力した語に対して示す結果として、記事に合うものはどれか。"
    choices:
      - "一部の拡張子から、購入可能な約 20 件だけを示す"
      - "入力した語そのものを、対応する 420 以上のすべての拡張子で示す"
      - "検索語を書き換えて、関連する別の名前だけを提案する"
      - "ログインしたユーザーにだけ、結果を表示する"
    answer: 1
    explanation: "Wikiの「発表内容 / アーキテクチャ」の「検索のシンプル化」を参照。以前は約 20 件の結果で、検索語が書き換えられることもあった。新しい検索は、入力した語そのものを全拡張子で示し、登録済みのドメインも含める。ログインの有無や端末によらず体験は同じ。"

  - q: "記事で、Registrar API に追加された機能として挙げられている組み合わせはどれか。"
    choices:
      - "サンドボックス・extensions エンドポイント・移管（transfers）"
      - "サンドボックス・請求書の発行・レジストリの運営"
      - "extensions エンドポイント・メールホスティング・SSL 証明書の販売"
      - "移管（transfers）・ドメインの転売市場・広告配信"
    answer: 0
    explanation: "Wikiの「発表内容 / アーキテクチャ」の「エージェント向けに拡張された Registrar」を参照。サンドボックスは実取引なしで試せ、extensions エンドポイントは 420 以上の拡張子ごとの情報を返し、移管は他のレジストラからのドメインをプログラムで取り込む。"

  - q: "記事のコード例で、ドメインの空き状況を確認する cf CLI のコマンドはどれか。"
    choices:
      - "cf registrar registrations create example.com"
      - "cf registrar registrations transfer-in example.com"
      - "cf registrar registrations check example.com"
      - "cf deploy example.com"
    answer: 2
    explanation: "Wikiの「コード例」を参照。check が空き確認、create が登録（購入）、transfer-in が他のレジストラからの移管に対応している。"

  - q: "次の移管コマンドについて、記事の内容に合う説明はどれか。"
    code: |
      cf registrar registrations transfer-in example.com \
        --auth-code "$(echo -n 'YOUR_EPP_CODE' | base64)" \
        --auto-renew
    codeLang: bash
    choices:
      - "EPP コードを Base64 でエンコードして --auth-code に渡している"
      - "EPP コードを平文のままコマンドの末尾に並べている"
      - "--auth-code には、Cloudflare の API トークンを渡す"
      - "このコマンドは、ドメインを新規に登録する（購入する）"
    answer: 0
    explanation: "Wikiの「コード例」を参照。echo -n で末尾の改行なしに EPP コードを出力し、base64 でエンコードした結果を --auth-code に渡している。transfer-in は他のレジストラからの移管で、--auto-renew は自動更新の指定と読める（記事は詳しく説明していない）。"

  - q: "検索が「すでに使われている」と「空いている」の証拠を扱う方法として、記事の説明に合うものはどれか。"
    choices:
      - "データセットや DNS に該当がなければ、そのドメインは必ず空いていると判断する"
      - "データセットや DNS にヒットすれば使用中とわかるが、ミスは空きの証拠にならない"
      - "DNS の答えは、レジストリへのライブ照会より常に権威がある"
      - "ライブ照会は最も速いので、すべての結果に最初に使う"
    answer: 1
    explanation: "Wikiの「複雑な問いを簡単に見せる仕組み」を参照。DNS 未設定のまま登録されているドメインや、ブロック対象のドメインがありうるため、ミスは空きの証明にならない。ライブ照会は最も新しく権威があるが、時間がかかり、上流の限られた処理能力を使う。"

  - q: "新しいドメイン検索の構成で、「アクティブな検索 1 回につき 1 つの調整役」を担うものはどれか。"
    choices:
      - "Workers KV"
      - "Durable Objects"
      - "1.1.1.1 リゾルバー"
      - "ETL パイプライン"
    answer: 1
    explanation: "Wikiの「速さと規模のための構成」を参照。Durable Object が検索セッションを調整し、結果の順序決定、ドメインごとの最良の証拠の保持、画面に見えている結果の追跡を行う。Workers KV は用意済みのデータ、Workers は入口と証拠収集を担う。"

  - q: "WebSocket 上で、ブラウザに結果を送る方法として、記事に合うものはどれか。"
    choices:
      - "更新のたびに、結果全体を毎回ダウンロードし直す"
      - "最初にスナップショットで順序付きのリストを送り、以降は変わった項目のデルタだけを送る"
      - "ブラウザが 420 以上のレジストリに、直接問い合わせる"
      - "結果はすべて検索の終了後に、まとめて 1 回だけ送る"
    answer: 1
    explanation: "Wikiの「速さと規模のための構成」と構成図を参照。スナップショットで順序付きのリストを作り、デルタメッセージは変わったフィールドだけを運ぶので、ブラウザは 1 件のドメインだけを更新できる。"

  - q: "Durable Object が結果を更新する前に行う比較として、記事の説明に合うものはどれか。"
    choices:
      - "新しい証拠は、常に古い証拠を置き換える"
      - "古い証拠を優先し、新しい証拠は破棄する"
      - "強い証拠は現在の答えを置き換えられるが、弱い証拠は置き換えられない"
      - "証拠の強さにかかわらず、アルファベット順に並べ替える"
    answer: 2
    explanation: "Wikiの「速さと規模のための構成」を参照。デルタを送る前に、新しい証拠と現在の答えを比べ、強い証拠だけが置き換える。より良い情報が届いたときに、影響を受けた結果だけを更新できる。"

  - q: "「空いている」という答えのキャッシュの有効期間が、「すでに取られている」という証拠より短い理由として、記事に合うものはどれか。"
    choices:
      - "空いているドメインは、いつでも登録されうるから"
      - "キャッシュの容量が、空き情報にだけ不足しているから"
      - "DNS の答えは、空き情報を含まないから"
      - "レジストリが、空き情報のキャッシュを禁止しているから"
    answer: 0
    explanation: "Wikiの「速さと規模のための構成」の証拠収集の説明を参照。空きのドメインは、いつ登録されても不思議でないため、「空き」という答えの有効期間は、すでに取られているという証拠より短くなる。"

  - q: "価格の見せ方と割引について、記事に合うものはどれか。"
    choices:
      - "登録価格だけを表示し、更新価格は購入時まで非表示にする"
      - "初回登録価格と更新価格の両方を全ドメインで表示し、割引時は元の原価に取り消し線を引く"
      - "すべての拡張子で、永続的に登録が無料になる"
      - "割引は .com のみが対象で、他の拡張子は対象外"
    answer: 1
    explanation: "Wikiの「透明な価格と値下げ」を参照。新しい検索と価格ページは、初回登録価格と更新価格の両方を表示する。Birthday Week から、.io・.dev・.app・.tech など一部の拡張子で初年度の登録割引がある。"
