title: より小さく、より速く、より安全に：Kimi と GLM を大規模に実行
slug: smaller-faster-safer-models
sourceUrl: https://blog.cloudflare.com/smaller-faster-safer-models/
wiki: ../docs/articles/2026-08-03-smaller-faster-safer-models.md
questions:
  - q: 記事で扱われている Kimi（Moonshot）と GLM（Z.ai）というモデルに共通する特徴として、記事に挙げられているものはどれか。
    choices:
      - 小規模・短コンテキスト・単一エキスパート構成
      - 大規模・長コンテキスト・Mixture-of-Experts（MoE）構成
      - 画像専用モデルであり、テキスト生成には非対応
      - CPU推論専用に設計されたモデル
    answer: 1
    explanation: 記事では、Kimi と GLM はいずれも「大規模・長コンテキスト・Mixture-of-Experts」というメモリ面で課題の大きい特徴を共有していると説明されている（Wiki「背景・課題」参照）。

  - q: 記事で紹介されている3つの最適化手法の組み合わせとして正しいものはどれか。
    choices:
      - モデル蒸留、プルーニング、知識蒸留
      - KVキャッシュの量子化、モデル重みの圧縮、キャッシュ整合性の保護
      - GPU増設、ネットワーク帯域拡張、ロードバランサー導入
      - プロンプト短縮、キャッシュ無効化、バッチサイズ固定化
    answer: 1
    explanation: 記事の中心テーマは、KVキャッシュの量子化・モデル重みの圧縮・キャッシュ整合性の保護という3つの最適化手法である。

  - q: すべての実験で使用されているオープンソースの推論フレームワークはどれか。
    choices:
      - vLLM
      - TensorRT-LLM
      - SGLang
      - Triton Inference Server
    answer: 2
    explanation: 記事では、すべての実験がオープンソースの推論フレームワーク SGLang 上で行われたと明記されている。

  - q: KVキャッシュをBF16からFP8（e4m3）に量子化した場合の直接的な効果として、記事に述べられているものはどれか。
    choices:
      - キャッシュサイズが2倍に増える
      - キャッシュサイズが半分になる
      - 精度が大幅に劣化し実用に耐えない
      - モデルの重みサイズが変化する
    answer: 1
    explanation: 記事では、KVキャッシュを16bitのBF16から8bit浮動小数点のFP8（e4m3）に切り替えることで、キャッシュサイズを半減できると説明されている。

  - q: Kimi K2.6において、KVキャッシュをFP8に量子化した結果、対応可能なコンテキスト長はどう変化したか。
    choices:
      - 約68.6万トークンから137万トークンへと倍増した
      - 変化しなかった
      - 半分に減少した
      - 無限大になった
    answer: 0
    explanation: 記事では、FP8量子化によりKimi K2.6の対応コンテキスト長が約68.6万トークンから137万トークンへと倍増したと述べられている。

  - q: KVキャッシュのBF16とFP8を比較した際の同時実行数とスループットについて、記事の内容として正しいものはどれか。
    choices:
      - BF16は同時実行数64まで動作し、FP8は32が上限
      - BF16は同時実行数32でメモリ上限に達するが、FP8は同時実行数64まで機能し、BF16のピーク比で約41%高速化する
      - 両者の同時実行数の上限は同じで、性能差もない
      - FP8は同時実行数が上がるとむしろ遅くなる
    answer: 1
    explanation: 記事では、BF16は同時実行数32でメモリ上限に達するのに対し、FP8は同時実行数64まで機能し、2,192トークン/秒というBF16のピーク比で約41%高速なスループットを達成し、トークンあたりコストも約30%削減できたと説明されている。

  - q: disaggregated prefill/decode アーキテクチャにおいて、記事が推奨する精度フォーマットの使い分けとして正しいものはどれか。
    choices:
      - Prefill（計算律速）はBF16を維持し、Decode（メモリ律速）はFP8を活用する
      - Prefill・Decodeともに常にINT4を使う
      - Prefillのみに量子化を適用し、Decodeには適用しない
      - Decodeは常にBF16を維持し、Prefillのみを量子化する
    answer: 0
    explanation: 記事では、Prefill段階は計算律速であるためBF16キャッシュを維持し、Decode段階はメモリ制約がボトルネックになりやすいためFP8を活用するという使い分けが説明されている。

  - q: GLM 5.2の重みをFP8からINT4に圧縮した結果として、記事に述べられている数値の組み合わせとして正しいものはどれか。
    choices:
      - チェックポイントサイズが705GBから421GBへ40%削減され、GPUあたりメモリ消費は約88GBから約52GBに減少した
      - チェックポイントサイズは変化せず、GPUメモリ消費だけが半減した
      - チェックポイントサイズが2倍に増加し、精度が大幅に向上した
      - GPUあたりメモリ消費が88GBから176GBに倍増した
    answer: 0
    explanation: 記事では、GLM 5.2のINT4圧縮によりチェックポイントサイズが705GBから421GBへと40%削減され、8-wayテンソル並列構成でのGPUあたりメモリ消費は約88GBから約52GBに減少したと説明されている。

  - q: モデル重みをINT4に圧縮した場合の、DecodeフェーズとPrefillフェーズそれぞれの性能変化について、記事の説明として正しいものはどれか。
    choices:
      - Decode・Prefillともに常に高速化する
      - Decodeは高速化する一方、Prefillは重みの展開が必要なためむしろ遅くなる
      - Decodeは遅くなり、Prefillは高速化する
      - どちらのフェーズにも性能への影響はない
    answer: 1
    explanation: |
      記事では、Decodeフェーズは重みのストリーミング量削減により同時実行数1で55%、高同時実行数でも21〜27%の高速化を示す一方、Prefillフェーズでは INT4 の重みが計算前に展開を必要とするためむしろ遅くなる（INT4は約8,660 tok/s、FP8は約10,160 tok/s）と説明されている。

  - q: 量子化・圧縮によって同時実行数が向上した結果として生じる新たなリスクと、その対策について記事の説明として正しいものはどれか。
    choices:
      - リスクは生じず、対策も不要である
      - 数百リクエストが同じ物理KVキャッシュページを共有するようになり、ページごとのタグを検証して不一致時にリクエストを中断する整合性チェックが導入された
      - GPUの台数を単純に倍増させることで対応した
      - 整合性チェックの導入によりスループットが半減した
    answer: 1
    explanation: 記事では、同時実行数の向上により数百件のリクエストが同じ物理KVキャッシュページを共有するようになるため、各ページに再割り当てのたびに更新されるタグを付与し、デコード前にリクエストごとの期待マッピングを検証、不一致時はリクエストを中断する仕組みが導入されたと説明されている。オーバーヘッドはスループット変化−0.38%〜−0.79%、p95レイテンシ増加1%未満に抑えられている。
