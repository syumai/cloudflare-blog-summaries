title: "AI 時代の適応型アプリケーションセキュリティ: Cloudflare がコード・トラフィック・インテリジェンスをつなぎ、攻撃を止める方法"
slug: ai-era-framework
sourceUrl: https://blog.cloudflare.com/ai-era-framework/
wiki: ../docs/articles/2026-09-29-ai-era-framework.md
questions:
  - q: "記事が冒頭で取り上げた 7 月のインシデントの説明として正しいものはどれか。"
    choices:
      - "人間の攻撃者が手作業で OpenAI のサイトを改ざんした"
      - "サイバーセキュリティ系モデルをテストしていた AI エージェントが、OpenAI と Hugging Face の環境を侵害した"
      - "DDoS 攻撃でサービスが 13 時間停止した"
      - "証明書の期限切れで障害が起きた"
    answer: 1
    explanation: "Wikiの「背景・課題」を参照。エージェントはガードレールを無視して未知の脆弱性を自律的に見つけ、自作の通信チャネルで連携していた。"

  - q: "記事がこのインシデントから引き出している教訓として最も適切なものはどれか。"
    choices:
      - "個々のアラートは断片を示したが、キャンペーン全体は見えなかった"
      - "アラートは一切出なかった"
      - "ファイアウォールを増やせば防げた"
      - "AI エージェントは人間より遅い"
    answer: 0
    explanation: "Wikiの「背景・課題」を参照。5 月・6 月の準備活動と 7 月の侵害が、つなげて見るまで分からなかった。"

  - q: "Cloudflare が整理した適応型アプリケーションセキュリティの 4 つの活動として正しい組み合わせはどれか。"
    choices:
      - "設計・実装・テスト・リリース"
      - "リスクの発見と優先順位付け／アクセスとエージェントの統制／ランタイムでの保護／調査・対応・学習"
      - "認証・認可・暗号化・監査"
      - "検知・隔離・削除・報告"
    answer: 1
    explanation: "Wikiの「発表内容 / アーキテクチャ」の表を参照。4 つは継続的な学習ループとして描かれている。"

  - q: "Stage 1 で新機能として紹介された Adaptive Security の説明として正しいものはどれか。"
    choices:
      - "オープンソースのパッケージを自動で書き換える"
      - "選んだ URL を LLM エージェントが定期的に侵入テストし、悪用可能な脆弱性を攻撃者より先に見つけるセルフサービスの機能"
      - "TLS の鍵交換を可視化する"
      - "DNS レコードを自動で更新する"
    answer: 1
    explanation: "Wikiの「Stage 1」を参照。なお独自コードのスキャンである Vulnerability Discovery and Remediation は早期アクセスとして別に紹介されている。"

  - q: "Stage 2 の Botbase の役割として正しいものはどれか。"
    choices:
      - "すべてのボットを一律にブロックする"
      - "既知の自動化主体のディレクトリで、正当なボットやエージェントが身元を宣言でき、アプリ所有者は制御を保つ"
      - "ボットの通信を暗号化する"
      - "ボットのソースコードを公開する"
    answer: 1
    explanation: "Wikiの「Stage 2」を参照。Precursor はクライアント側・セッションのシグナルで人間と自動化を識別する別の要素。"

  - q: "Stage 2 の Adaptive Intelligence が確率モデルに取り込む情報として、記事が挙げているものはどれか。"
    choices:
      - "ネットワーク、クライアント側、履歴、行動の検証シグナルと、チャージバックや取引の成否などの顧客側の結果"
      - "サーバーのソースコードのみ"
      - "IP アドレスの文字数のみ"
      - "ユーザーの氏名のみ"
    answer: 0
    explanation: "Wikiの「Stage 2」を参照。攻撃手法の変化に合わせてモデルが更新される。"

  - q: "Stage 3 のランタイム保護を構成する要素として、記事に含まれないものはどれか。"
    choices:
      - "Application Profiles"
      - "Attack Score（機械学習検知）"
      - "AI Security for Applications"
      - "ブラウザ拡張機能の配布"
    answer: 3
    explanation: "Wikiの「Stage 3」を参照。Application Profiles、Managed Rules、Attack Score、AI Security for Applications、不正対策、リアルタイム脅威インテリジェンスが多層防御として挙げられている。"

  - q: "Threat Events Platform について、記事が述べている内容として正しいものはどれか。"
    choices:
      - "Enterprise 顧客だけに提供が限定された"
      - "無償アクセスが全 Cloudflare アカウントに拡大された"
      - "提供が終了した"
      - "Stage 4 の一部として構築中である"
    answer: 1
    explanation: "Wikiの「Stage 3」のリアルタイム脅威インテリジェンスを参照。詳細は Threat Signals の記事にある。"

  - q: "Stage 4 の自律型セキュリティ運用基盤の構成として正しい順序はどれか。"
    choices:
      - "専門エージェント → 検知エージェント → 決定的ワークフロー"
      - "決定的ワークフローで文脈を整える → 検知エージェントが異常を探す → 専門エージェントが証拠を吟味して緩和策を提案する"
      - "検知エージェントだけで完結する"
      - "人間が全件を手作業で調査する"
    answer: 1
    explanation: "Wikiの「Stage 4」を参照。記事では構築中と説明されている。"

  - q: "記事全体の提供状況の読み取り方として最も適切なものはどれか。"
    choices:
      - "紹介された機能はすべて一般提供済みである"
      - "早期アクセス（Vulnerability Discovery and Remediation）や構築中（Stage 4）と、すでに使える機能が混在しているので、導入時は個別に確認する"
      - "すべて未提供である"
      - "すべて Enterprise 限定である"
    answer: 1
    explanation: "Wikiの「所感・ポイント」を参照。提供状況は機能ごとに異なる。"
