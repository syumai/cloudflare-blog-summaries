title: "IPsec に対する量子ダウングレード攻撃の防止"
slug: ipsec-downgrade-protection
sourceUrl: https://blog.cloudflare.com/ipsec-downgrade-protection/
wiki: ../docs/articles/2026-09-29-ipsec-downgrade-protection.md
questions:
  - q: "ダウングレード攻撃の説明として最も適切なものはどれか。"
    choices:
      - "通信路上の攻撃者がメッセージを改ざんし、PQ 対応の端点に弱い（古典）暗号を使わせる攻撃"
      - "保存した暗号文を将来の量子コンピュータで解読する攻撃"
      - "DDoS でサーバーを停止させる攻撃"
      - "サーバーの秘密鍵を物理的に盗む攻撃"
    answer: 0
    explanation: "Wikiの「背景・課題」を参照。中間者が相手は PQ 非対応と思わせ、PQ の保護を無効にして古典に落とす。保存して後で解読するのは harvest-now, decrypt-later で別の脅威。"

  - q: "IPsec が動作する層と、TLS / QUIC との違いとして正しいものはどれか。"
    choices:
      - "IPsec は IP 層で動作し、TLS / QUIC はトランスポート層（TCP / UDP 上）で動作する"
      - "IPsec はアプリケーション層で、TLS はネットワーク層である"
      - "IPsec と TLS は同じ層で動く"
      - "IPsec は UDP 上でのみ動く"
    answer: 0
    explanation: "Wikiの「発表内容 / アーキテクチャ」の「IPsec の位置づけ」を参照。IPsec はより低い層にあり、ネットワークインフラに深く組み込まれている。"

  - q: "IKEv2 の設計上、今回の攻撃の鍵になっている点はどれか。"
    choices:
      - "暗号化に AES を使っていること"
      - "各当事者が自分の送信メッセージだけに署名し、ハンドシェイク全体には署名しないこと"
      - "認証に必ず証明書が必要なこと"
      - "初期交換が UDP で行われること"
    answer: 1
    explanation: "Wikiの「IKEv2 のハンドシェイク」を参照。署名する側は、相手と同じメッセージ列を見たことを確認できない。TLS 1.3 はトランスクリプト全体に署名する。"

  - q: "量子版のダウングレード攻撃が実行しにくい主な理由はどれか。"
    choices:
      - "古典暗号が十分に強いため"
      - "量子計算をハンドシェイクの完了前にリアルタイム（オンライン）で行う必要があるため"
      - "IPsec は暗号化されていないため"
      - "攻撃者が必ずレスポンダの秘密鍵を持つ必要があるため"
    answer: 1
    explanation: "Wikiの「この攻撃は現実的か」を参照。オフラインで計算できる harvest-now, decrypt-later と異なり、最初の標的にはなりにくい。ただし Q-day が先に来る可能性は無視できない。"

  - q: "Mallory が自分の資格情報で有効な署名を作り、攻撃を成立させられる理由として、記事が述べているものはどれか。"
    choices:
      - "レスポンダは自分の送信メッセージにしか署名せず、どのイニシエータ ID を受け入れたかをイニシエータに確認させないため、信頼する任意のイニシエータの認証を受け入れてしまう"
      - "署名検証が実装されていないため"
      - "暗号鍵が平文で送信されるため"
      - "IKEv2 が認証を省略できるため"
    answer: 0
    explanation: "Wikiの「攻撃の流れ」を参照。これはアイデンティティ・ミスバインディングの一種で、レスポンダは Mallory（IDm）、イニシエータはレスポンダ（IDr）と接続したと信じる。"

  - q: "古典のみの鍵共有を無効にする対策や、HSTS 風の記憶による対策が IKEv2 で不十分とされる理由として適切なものはどれか。"
    choices:
      - "PQ が標準化されていないため"
      - "イニシエータは事前にレスポンダの能力を知らないことが多く、また IKEv2 では交渉が初期交換で行われるのに、ピアが名乗るのは認証交換なので手遅れになるため"
      - "HSTS が IPsec で禁止されているため"
      - "古典暗号が既に廃止されているため"
    answer: 1
    explanation: "Wikiの「防御: なぜトランスクリプト全体に署名するのか」を参照。根本原因は split view であり、全トランスクリプトへの署名が原理的な解決になる。"

  - q: "次の流れで、Mallory がイニシエータ側の通知だけを削除した場合の結果はどれか。"
    code: |
      Initiator --IKE_SA_INIT(+FULL_TRANSCRIPT_AUTH)--> [Mallory が通知を削除] --> Responder
      Initiator <--IKE_SA_INIT(+FULL_TRANSCRIPT_AUTH)-- Responder
    codeLang: text
    choices:
      - "ダウングレードが成功し、通信は古典暗号になる"
      - "レスポンダは旧ロジック、イニシエータは新ロジックを使い、署名対象が食い違って AUTHENTICATION_FAILURE になる"
      - "両者とも新ロジックを使い、接続は成功する"
      - "レスポンダが接続を無視する"
    answer: 1
    explanation: "Wikiの「IKE_SA_INIT_FULL_TRANSCRIPT_AUTH 拡張」を参照。レスポンダはイニシエータが通知しなくても通知するため、片方だけ削除すると期待が食い違う。"

  - q: "拡張で、レスポンダがイニシエータの通知がなくても通知する理由として正しいものはどれか。"
    choices:
      - "TLS 1.3 と同じ仕様に合わせるため"
      - "無条件に通知することで、通知の片方だけを消す攻撃が必ず署名の食い違いとして検出され、拡張自体のダウングレードを防げるため"
      - "通信量を増やして攻撃者を妨害するため"
      - "イニシエータを強制的に切断するため"
    answer: 1
    explanation: "Wikiの「IKE_SA_INIT_FULL_TRANSCRIPT_AUTH 拡張」を参照。TLS 1.3 のサーバーは要求された拡張にだけ返答する点と異なる。"

  - q: "両方の通知を削除した場合に、Mallory がさらに必要とすることは何か。"
    choices:
      - "イニシエータの署名だけの偽造"
      - "イニシエータとレスポンダの両方の署名の偽造（ミスバインディングなら別のレスポンダ ID を示す必要もあり、通常は認証に失敗する）"
      - "何も必要ない"
      - "Cloudflare の管理者権限"
    answer: 1
    explanation: "Wikiの「IKE_SA_INIT_FULL_TRANSCRIPT_AUTH 拡張」を参照。両者が旧ロジックに戻るが、レスポンダの署名も偽造する必要がある。双方の資格情報を侵害する KCI にはもっと簡単な攻撃手段がある。"

  - q: "Cloudflare のこの保護機能の提供状況として正しいものはどれか。"
    choices:
      - "すべての顧客に既に強制適用されている"
      - "Cloudflare WAN と Magic Transit でベータ提供中で、アカウントチームに依頼して ipsec_downgrade_protection フラグを有効にする"
      - "Workers の設定ファイルで有効にする"
      - "提供予定はない"
    answer: 1
    explanation: "Wikiの「有効化方法と提供状況」を参照。十分なベータテスト後に全アカウントで有効にする予定で、フラグは顧客側イニシエータが新しい通知を誤処理するまれなケースに備えたもの。"
