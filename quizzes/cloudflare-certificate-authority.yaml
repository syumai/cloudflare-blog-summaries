title: "Cloudflare が「インターネット全体のための認証局」を作る"
slug: cloudflare-certificate-authority
sourceUrl: https://blog.cloudflare.com/cloudflare-certificate-authority/
wiki: ../docs/articles/2026-09-29-cloudflare-certificate-authority.md
questions:
  - q: "この記事で Cloudflare が発表した内容として正しいものはどれか。"
    choices:
      - "すでに公開証明書の発行を開始した"
      - "公開認証局（CA）になる意向を表明し、ルートプログラムへの申請と GlobalSign ルートの取得合意などの節目を示した"
      - "Let's Encrypt を買収した"
      - "証明書を廃止して別の方式に置き換える"
    answer: 1
    explanation: "Wikiの「TL;DR」「背景・課題」を参照。記事は『証明書はまだ発行しておらず、しばらく先になる』と明記し、申請と取得合意という最初の節目を報告している。"

  - q: "Cloudflare が収録申請を行ったルートプログラムの組み合わせとして正しいものはどれか。"
    choices:
      - "Chrome、Apple、Microsoft、Mozilla"
      - "Chrome と Mozilla のみ"
      - "Apple と Microsoft のみ"
      - "Java と Android のみ"
    answer: 0
    explanation: "Wikiの「TL;DR」を参照。Chrome・Apple・Microsoft・Mozilla の 4 つのルートプログラムに申請している。"

  - q: "既存の GlobalSign ルートを取得する主な理由はどれか。"
    choices:
      - "ルートプログラムの審査を免除されるため"
      - "新規ルートは数年間広く普及せず、更新の止まった古い端末には届かないため、発行初日から幅広い端末に届く実績あるルートが必要なため"
      - "PQ 署名に対応しているのは GlobalSign のルートだけのため"
      - "Cloudflare のデータセンターの数を増やすため"
    answer: 1
    explanation: "Wikiの「信頼への 2 つの道」を参照。既存ルートは過去のデバイスへの到達性を、新ルートは将来のポリシーへの適合を担う。"

  - q: "記事が『システミックなリスク』として指摘していることはどれか。"
    choices:
      - "無料の証明書は暗号強度が低い"
      - "支配的な無料・自動の認証局が不調になると、Web の大半に同等の代替がない"
      - "証明書の有効期間が長すぎる"
      - "ACME は標準化されていない"
    answer: 1
    explanation: "Wikiの「背景・課題」を参照。Let's Encrypt の貢献を高く評価しつつ、最大手が不調の週には代替が用意されていない点をリスクとしている。"

  - q: "記事が示した発行シェアのグラフ（未失効プレ証明書、CCADB 所有者別、2026 年 6 月）で、最大の発行者 Let's Encrypt (ISRG) のシェアとして正しいものはどれか。"
    choices:
      - "18.5%"
      - "39.2%"
      - "68.8%"
      - "89.4%"
    answer: 1
    explanation: "Wikiの「無料証明書の新しい供給元」の図を参照。最大の単独発行者が 39.2%、上位 3 社で 68.8%、上位 5 社で 89.4%。"

  - q: "Cloudflare の CA に対して、既存の無料 CA の利用者が移行するために必要な変更として記事が述べているものはどれか。"
    choices:
      - "クライアントを書き直して独自プロトコルに対応させる"
      - "ACME クライアントのディレクトリ URL を変更する"
      - "すべてのサーバーの OS を更新する"
      - "証明書を手作業で申請する"
    answer: 1
    explanation: "Wikiの「無料証明書の新しい供給元（ACME ファースト）」を参照。発行と更新は ACME が前提で、新しいツールも再設計も不要とされている。"

  - q: "Cloudflare の CA が『発行の条件』にすると述べているものはどれか。"
    choices:
      - "ACME Renewal Information（ARI, RFC 9773）に対応し、更新の自動化を維持していること"
      - "Cloudflare のプランに加入していること"
      - "証明書を年に 1 回だけ更新すること"
      - "MTC にのみ対応していること"
    answer: 0
    explanation: "Wikiの「回復力のための設計」を参照。加入者は更新エンドポイントをポーリングし、公開された更新ウィンドウに従い、置き換え対象の証明書を識別する自動化を維持する必要がある。"

  - q: "記事が、ARI に基づく更新ウィンドウの運用で可能になるとしていることはどれか。"
    choices:
      - "失効の際に、影響を受ける証明書の更新ウィンドウを前倒しして置き換えを分散し、進捗を追跡できる"
      - "証明書の署名を省略できる"
      - "すべてのクライアントの更新を強制的に停止できる"
      - "CT ログへの提出を不要にできる"
    answer: 0
    explanation: "Wikiの「回復力のための設計」を参照。失効の期限とサイトの稼働維持との板挟みを避けるため、ウィンドウを前倒ししつつ置き換えを時間的に分散させる。"

  - q: "記事が『監査は時点ごとの確認にすぎない』ことを踏まえて打ち出している透明性の取り組みに含まれないものはどれか。"
    choices:
      - "証明書に署名するソフトウェアの再現可能ビルドの公開"
      - "鍵を保持する HSM の証明（attest）"
      - "発行の健全性とインシデントの公開ダッシュボード"
      - "発行した全証明書の秘密鍵の公開"
    answer: 3
    explanation: "Wikiの「回復力のための設計」を参照。秘密鍵の公開はあり得ず、再現可能ビルド・HSM の証明・公開ダッシュボードの 3 点が挙げられている。"

  - q: "記事が、1 つの CA で古典証明書と Merkle Tree Certificates（MTC）の両方を扱う狙いとして述べているものはどれか。"
    choices:
      - "古典証明書を直ちに廃止するため"
      - "利用者が自分のペースで採用でき、2 つのシステムを動かしたり、バランスが変わるたびに作り直したりしなくて済むようにするため"
      - "MTC だけを有料にするため"
      - "ブラウザに MTC を強制するため"
    answer: 1
    explanation: "Wikiの「ポスト量子インターネットのための CA」を参照。古典証明書と MTC を 1 つのライフサイクル・1 組の保証で扱い、ハードなカットオーバーを避ける。最初の MTC は 2027 年第 1 四半期の計画。"
