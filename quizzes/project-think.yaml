title: "Project Think：Cloudflareで次世代のAIエージェント構築"
slug: project-think
sourceUrl: https://blog.cloudflare.com/ja-jp/project-think/
wiki: ../docs/articles/2026-04-15-project-think.md
questions:
  - q: >-
      Project Think（Agents SDK）が基盤としている技術は何か。
    choices:
      - Kubernetesクラスタ
      - Durable Objects
      - 常時稼働の仮想マシン（VM）
      - R2オブジェクトストレージのみ
    answer: 1
    explanation: >-
      Wikiの「発表内容 / アーキテクチャ」→「長時間実行されるエージェント：Durable Objectsという基盤」にある通り、Agents SDKはDurable Objectsを基盤としており、アクターモデルを採用して全エージェントにID・永続状態・メッセージ認識能力を与えている。

  - q: >-
      Durable Objectsが持つ、VM/コンテナと対比したときの特徴として<strong>正しいもの</strong>はどれか。
    choices:
      - アイドル時も常にフルコストがかかる
      - 状態管理には必ず外部データベースが必要
      - スケーリングには手動での容量プロビジョニングが必要
      - アイドル時（ハイバネーション中）の消費コストがゼロになる
    answer: 3
    explanation: >-
      Wikiの「VM/コンテナと比較する表」に対応する記述にある通り、Durable Objectsはアイドル時のコストがゼロで、状態は内蔵SQLiteに保持され、スケーリングはエージェント毎に自動で行われる。これらはいずれもVM/コンテナモデルの弱点を補うものとして記事が挙げている特徴である。

  - q: >-
      `runFiber()` が提供する機能として、記事の説明に最も近いものはどれか。
    choices:
      - 耐久性のある関数呼び出し。実行前にSQLiteへ登録され、チェックポイントから再開できる
      - HTTPリクエストを一定回数まで自動リトライするだけの機能
      - "`setTimeout` の薄いラッパーで、状態の永続化は行わない"
      - Durable Objectのストレージを手動でバックアップするコマンド
    answer: 0
    explanation: >-
      Wikiの「クラッシュ耐久性：ファイバーによる耐久実行」節にある通り、`runFiber()` は実行前にSQLiteへ登録される耐久性のある関数呼び出しで、`ctx.stash()` によるチェックポイントと `onFiberRecovered` フックによる復旧により、退去（eviction）されても処理を再開できる。

  - q: >-
      サブエージェントの実装について、記事の説明として<strong>正しいもの</strong>はどれか。
    choices:
      - 親エージェントとSQLiteを共有し、暗黙的にデータを共有する
      - 別リージョンにデプロイされる独立したVMとして動作する
      - Facetsを介して親と併置される子Durable Objectsとして実装され、独自の分離されたSQLiteを持つ
      - 外部のマイクロサービスとしてREST API経由で呼び出す必要がある
    answer: 2
    explanation: >-
      Wikiの「作業の委任：Facetsを介したサブエージェント」節にある通り、サブエージェントはFacetsを介して親と併置される子Durable Objectsで、各々が独自の分離されたSQLiteと実行コンテキストを持ち、ストレージレベルで分離される（暗黙的なデータ共有はない）。

  - q: >-
      セッションAPI（実験的）が会話履歴を扱う仕組みとして、記事の説明に<strong>合致しないもの</strong>はどれか。
    choices:
      - 会話をツリー構造として保存し、各メッセージが親メッセージIDを持つ
      - コンテキストが肥大化すると古いメッセージを完全に削除して容量を確保する
      - 既存の履歴を保ったまま別方向へフォークして代替案を探索できる
      - FTS5（SQLite全文検索）でセッション内・全セッション横断の検索ができる
    answer: 1
    explanation: >-
      Wikiの「続く会話：セッションAPI」節にある通り、コンテキストが肥大化した場合はメッセージを削除するのではなく要約する「非破壊的圧縮」で対応し、全履歴はSQLiteに保存され続ける。「完全に削除する」という記述は誤り。

  - q: >-
      Cloudflare API MCPサーバーの事例で、コード実行方式（`search()` + `execute()`）とエンドポイント毎に単純なツールを用意する方式のトークン消費差について、記事の説明として正しいものはどれか。
    choices:
      - 両方式のトークン消費はほぼ同じ
      - コード実行方式の方がトークン消費が多い
      - どちらの方式も約10万トークンで横ばいになる
      - コード実行方式は約1,000トークン、エンドポイント毎ツール方式は約117万トークンで、約99.9%の削減
    answer: 3
    explanation: >-
      Wikiの「ツール呼び出しからコード実行へ」節にある通り、公開ツールを`search()`と`execute()`のみに絞るコード実行方式は約1,000トークンの消費で済むのに対し、エンドポイント毎に単純なツールを用意する従来方式では約117万トークンを消費し、約99.9%の削減につながったとされている。

  - q: >-
      Dynamic Workersの「能力モデル」に基づく設計思想として、記事の説明に最も近いものはどれか。
    choices:
      - "`globalOutbound: null`（ネットワークアクセスなし）という権限が最も少ない状態から出発し、バインディング経由で明示的に機能を付与する"
      - まず全ての権限を与え、危険な操作だけをブラックリストで禁止する
      - すべてのDynamic Workersは常にフルのネットワークアクセス権限を持つ
      - コンテナと全く同じ権限モデルをそのまま流用している
    answer: 0
    explanation: >-
      Wikiの「安全なサンドボックス：Dynamic Workers」節にある通り、Dynamic Workersは権限が最も少ない状態（`globalOutbound: null`）から出発し、開発者がバインディングを通じてリソース毎に明示的に機能を付与していく「能力モデル」を採用している。これにより「過剰な行為を防ぐ」ではなく「何を許可するか」という発想から設計が始まる。

  - q: >-
      （コード読解）以下は記事の「永続的なメモリと長い会話」節にある `configureSession()` のコード例である。`"soul"` と `"memory"` の2つのコンテキストブロックの違いとして<strong>最も適切なもの</strong>はどれか。
    code: |
      configureSession(session: Session) {
        return session
          .withContext("soul", {
            provider: { get: async () => "You are a helpful coding assistant." }
          })
          .withContext("memory", {
            description: "Important facts learned during conversation.",
            maxTokens: 2000
          })
          .withCachedPrompt();
      }
    codeLang: ts
    choices:
      - 両方とも読み取り専用で、モデルは一切書き込めない
      - "\"memory\" はリクエストごとにリセットされ、DOのハイバネーションを越えて保存されることはない"
      - "\"soul\" は読み取り専用でシステムプロンプトの先頭に常に配置され、\"memory\" はモデルが set_context ツールで能動的に更新できる書き込み可能なブロックである"
      - 両方ともモデルが自由に書き換えられ、優先順位の違いはない
    answer: 2
    explanation: >-
      Wikiの「永続的なメモリ（コンテキストブロック）」コード例の解説にある通り、`"soul"` は読み取り専用でシステムプロンプトの先頭に常に配置され、`"memory"` はモデルが `set_context` ツールで能動的に更新できる書き込み可能なブロックである。`memory` に書き込まれた内容はDurable Objectのハイバネーションを越えてSQLiteに永続化される。

  - q: >-
      実行展開ラダー（Tier 0〜Tier 4）の設計原則として、記事の説明に最も近いものはどれか。
    choices:
      - すべてのエージェントは常にTier 4（Cloudflare Sandbox）から処理を開始する
      - エージェントはTier 0単独でも有用であるべきで、各階層は付加的（additive）に積み上がり、多くのタスクはTier 0を出ない
      - 各Tierは互いに排他的で、同時に1つのTierしか利用できない
      - Tierの数が増えるほど、実行コストは一律に下がっていく
    answer: 1
    explanation: >-
      Wikiの「実行展開ラダー」節にある通り、設計原則として「エージェントはTier 0単独でも有用であるべきで、各階層は付加的に積み上がる」とされ、多くのタスクはTier 0（ワークスペース）を出ないという前提で設計されている。ユーザーは必要に応じて機能を追加すればよく、最初から全ての権限を持たせる必要はない。

  - q: >-
      記事が位置づける「第3の波（インフラとしてのエージェント）」の特徴として<strong>正しいもの</strong>はどれか。
    choices:
      - ステートレスでリアクティブな会話のみを行い、メモリやツールを持たない
      - Pi・Claude Code・OpenClawのような、1ユーザーのノートパソコン上で動作するコーディングエージェントを指す
      - 従来のチャットボットと同義であり、耐久性の概念は含まれない
      - 耐久性・分散性・構造的安全性・サーバーレス性を備え、インターネット上で実行され、任意の数のユーザーのために構築・展開できる
    answer: 3
    explanation: >-
      Wikiの「第3の波」節にある通り、第1波はチャットボット（ステートレス・脆弱）、第2波はコーディングエージェント（ステートフルだが1ユーザーのノートパソコン上で動作し耐久性の保証がない）で、第3波は耐久性・分散性・構造的安全性・サーバーレス性を備え、インターネット上で実行され任意の数のユーザーのために構築・展開できるエージェントとされる。Project Thinkはこの第3の波を実現するためのプリミティブ群として位置づけられている。
