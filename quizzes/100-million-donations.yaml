title: "Cloudflare Impact が寄付（提供サービス）1億ドルに到達"
slug: 100-million-donations
sourceUrl: https://blog.cloudflare.com/100-million-donations/
wiki: ../docs/articles/2026-09-30-100-million-donations.md
questions:
  - q: "記事が述べる、Cloudflare Impact プログラムの到達点はどれか。"
    choices:
      - "提供サービス換算で 1 億ドルの寄付"
      - "現金 1 億ドルの助成金"
      - "1 億ドメインの保護"
      - "1 億件の攻撃のブロック"
    answer: 0
    explanation: "Wikiの「TL;DR」を参照。Impact プログラムが今週、donated services として 1 億ドルに到達すると述べている。現金の助成ではなく提供したサービスの価値である（「所感・ポイント」）。"

  - q: "記事が Impact プログラムの位置づけとして述べている内容はどれか。"
    choices:
      - "純粋な慈善活動であり、事業とは切り離している"
      - "事業とミッションの根幹であり、ほぼすべての取り組みの指針になっている"
      - "広告宣伝のための一時的なキャンペーン"
      - "政府からの委託事業"
    answer: 1
    explanation: "Wikiの「TL;DR」を参照。記事は Impact は慈善ではなく、事業とミッションの根幹だと述べる。"

  - q: "Project Galileo が始まった年と、現在の規模として正しいものはどれか。"
    choices:
      - "2017 年、33 州・440 サイト"
      - "2020 年、530 サイト"
      - "2014 年、120 か国超・3,500 ドメイン超"
      - "2026 年、8 か国"
    answer: 2
    explanation: "Wikiの「発表内容」の「1. Free → Impact」を参照。Galileo は 2014 年開始で、120 か国超・3,500 ドメイン超を対象とする。2017 年は Athenian Project、2020 年は Cloudflare for Campaigns。"

  - q: "Athenian Project の対象として正しいものはどれか。"
    choices:
      - "公職候補者"
      - "民主的な選挙を運営する州・地方政府（のち米国外の選挙管理機関も）"
      - "公立学校のみ"
      - "ジャーナリストのみ"
    answer: 1
    explanation: "Wikiの「発表内容」の「1. Free → Impact」を参照。Athenian Project（2017）は選挙を運営する州・地方政府向けで、のちに米国外の 8 か国の選挙管理機関へ拡大した。候補者向けは Cloudflare for Campaigns。"

  - q: "2026 年の市民社会向け攻撃レポートで、Project Galileo 参加者について述べられている内容はどれか。"
    choices:
      - "Web サイトの脆弱性悪用の試行が、平均的なユーザーの 7 倍超の割合だった"
      - "攻撃は平均より少なかった"
      - "DDoS のみが観測された"
      - "メディア組織は対象外だった"
    answer: 0
    explanation: "Wikiの「2. 市民社会への攻撃レポート」を参照。Galileo 参加者は脆弱性悪用の試行を平均の 7 倍超の割合で受けていた。"

  - q: "2025 年に Project Galileo 参加者に対してブロックされた攻撃は、記事によればおよそ何件か。"
    choices:
      - "3.85 億件"
      - "385 億件超（1 日あたり約 1 億 540 万件）"
      - "38.5 万件"
      - "1 日あたり約 1,000 件"
    answer: 1
    explanation: "Wikiの「1. Free → Impact」を参照。2025 年に 385 億件超、1 日あたり約 1 億 540 万件をブロックした。"

  - q: "バルセロナで共催されたハッカソンの特徴として正しいものはどれか。"
    choices:
      - "Cloudflare が初めてジャーナリスト向けに開いたイベントで、Media Party のカンファレンスの一部だった"
      - "ソフトウェアエンジニアのみが参加した"
      - "オンライン開催のみだった"
      - "優勝チームは賞金 1 億ドルを得た"
    answer: 0
    explanation: "Wikiの「3. これから」を参照。Media Party の 3 日間のカンファレンスの一部として、初めてジャーナリスト向けに開催された。"

  - q: "ハッカソンで優勝した AIdas が行うことはどれか。"
    choices:
      - "ウェブサイトの DDoS 攻撃を自動で遮断する"
      - "同じ質問に対する複数の LLM の答えを比較し、応答をオープンデータとして記録する"
      - "ドメインの登録を自動化する"
      - "選挙の投票結果を集計する"
    answer: 1
    explanation: "Wikiの「3. これから」を参照。AIdas は政治的に争点となるテーマでの AI のバイアスを研究者・ジャーナリストが調べられるようにするツール。"

  - q: "記事が挙げる「防御にとどまらない」拡大中の取り組みとして、含まれないものはどれか。"
    choices:
      - "Galileo 参加者への Bot Management と AI Crawl Control の無償提供"
      - "非営利スタートアップへの 25 万ドル超のクレジット"
      - "人権団体向けの自動化ツールの開発"
      - "一般の開発者向けの有料プランの値下げ"
    answer: 3
    explanation: "Wikiの「3. これから」の「拡大中の取り組み」を参照。値下げへの言及はない。"

  - q: "記事の締めくくりで、筆者が Impact プログラムについて強調している点はどれか。"
    choices:
      - "過去の実績であり、今後は縮小する"
      - "ミッションとともに、そこで働くことを選ぶ人々を通じて Cloudflare のアイデンティティを形づくり続けている"
      - "財務上の負担になっている"
      - "外部委託で運営している"
    answer: 1
    explanation: "Wikiの「4. Join Us」を参照。ボランティアのエンジニアが Galileo を入社理由に挙げたことを紹介し、採用への参加を呼びかけている。"
