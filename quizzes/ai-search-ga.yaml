title: "AI Search が一般提供（GA）に: マルチモーダル埋め込み・大容量ファイル・OCR・課金開始"
slug: ai-search-ga
sourceUrl: https://blog.cloudflare.com/ai-search-ga/
wiki: ../docs/articles/2026-10-01-ai-search-ga.md
questions:
  - q: "AI Search の課金が開始される日付はいつか。"
    choices:
      - "2026年8月1日"
      - "2026年10月1日"
      - "2026年11月1日"
      - "2027年1月1日"
    answer: 2
    explanation: "Wikiの「TL;DR」と「課金と料金体系」を参照。GA に合わせて、課金は 2026-11-01 に開始される。有効化の前にリマインダーメールが送られる。"

  - q: "従来の AI Search の画像対応の方式として、記事が説明しているものはどれか。"
    choices:
      - "画像のピクセルを直接埋め込む"
      - "物体検出でキャプションを生成し、そのテキストを埋め込む"
      - "画像を常に OCR だけで処理する"
      - "画像はインデックスの対象外だった"
    answer: 1
    explanation: "Wikiの「マルチモーダル埋め込みと検索」を参照。従来は物体検出 → キャプション生成 → テキスト埋め込みという素朴な実装で、キャプションに書かれた情報でしか検索できなかった。"

  - q: "今回追加されたネイティブ画像検索について正しいものはどれか。"
    choices:
      - "キャプション方式は廃止され、ネイティブ方式だけになった"
      - "キャプション方式とネイティブ画像検索の両方を行う"
      - "画像検索は OCR を有効にしたときだけ使える"
      - "ネイティブ画像検索は検索クエリにテキストを使えない"
    answer: 1
    explanation: "Wikiの「マルチモーダル埋め込みと検索」を参照。キャプションベースの理解と、ネイティブ画像検索の両方を行う。キャプションが捉えない視覚的な細部にも一致できる。"

  - q: "埋め込みを効率化するために記事が挙げている手法はどれか。"
    choices:
      - "Matryoshka Representation Learning（MRL）"
      - "Product Quantization のみ"
      - "Retrieval Augmented Fine-tuning"
      - "BM25 の重み調整"
    answer: 0
    explanation: "Wikiの「マルチモーダル埋め込みと検索」を参照。MRL により、小さな埋め込みでも有用な情報を保ちつつ、ストレージを抑え、検索を高速に保つ。"

  - q: "埋め込みモデルがテキスト専用の場合、画像でクエリしたときの動作として正しいものはどれか。"
    choices:
      - "エラーになり、画像クエリは使えない"
      - "クエリ画像を ToMarkdown でテキスト化し、そのキャプションで検索する"
      - "画像のピクセルを自動でベクトル化して検索する"
      - "OCR が自動で有効になる"
    answer: 1
    explanation: "Wikiの「マルチモーダル埋め込みと検索」を参照。テキスト専用モデルでも、クエリ画像を ToMarkdown でキャプション化して検索できる。ネイティブ対応モデルでは画像を直接埋め込む。"

  - q: "ファイルサイズ上限の変更として正しいものはどれか。"
    choices:
      - "1 MiB から 4 MiB"
      - "4 MiB から 10 MiB"
      - "10 MiB から 100 MiB"
      - "上限が撤廃された"
    answer: 1
    explanation: "Wikiの「大きなファイルと OCR」を参照。テキストファイル（Markdown・HTML・CSV・JSON など）と PDF の上限が 4 MiB から 10 MiB に拡大した。"

  - q: "OCR について正しいものはどれか。"
    choices:
      - "Enterprise プランのみで利用できる"
      - "全アカウントで利用でき、画像処理の取り込みトークンとして課金される"
      - "無料で、課金対象外である"
      - "クエリ時にのみ動作し、取り込み時には使われない"
    answer: 1
    explanation: "Wikiの「大きなファイルと OCR」を参照。OCR は全アカウントで利用可能で、新しい料金体系のもと、画像処理の取り込みトークンとして課金される。チャンク化・埋め込みの前に実行される。"

  - q: "GA 時の料金で、プレビュー時から変更された点はどれか。"
    choices:
      - "取り込み単価が半額になった"
      - "ストレージの無料枠が 10 GB から 1 GB になった"
      - "無料枠のクエリが、共有 2,000 件からセマンティック 1,000 件とフルテキスト 1,000 件に分けられた"
      - "再ランキングが有料になった"
    answer: 2
    explanation: "Wikiの「課金と料金体系」を参照。変更はクエリ無料枠の 1 点で、共有プール 2,000 件がセマンティック 1,000 件とフルテキスト 1,000 件に分割された。"

  - q: "AI Search の料金で、料金に含まれる（別途課金されない）ものとして正しいものはどれか。"
    choices:
      - "インスタンス時間とキャパシティユニット"
      - "パース・チャンク化・Workers AI での埋め込み・キーワードインデックス・再ランキング"
      - "月額の最低料金"
      - "すべてのサードパーティモデルの利用料"
    answer: 1
    explanation: "Wikiの「課金と料金体系」を参照。支払うのは取り込み・ストレージ・クエリの 3 つで、その間の処理は料金に含まれる。インスタンス時間や月額最低料金は無く、サードパーティモデルは別請求。"

  - q: "記事が「今後の予定」として挙げているものとして正しいものはどれか。"
    choices:
      - "ビデオと音声の取り込みパイプライン"
      - "Vectorize の廃止"
      - "OCR の有料プラン限定化"
      - "画像検索の提供終了"
    answer: 0
    explanation: "Wikiの「今後の予定」を参照。ビデオ・音声の取り込み、キーワード検索エンジンの再構成、Cloudflare 上の既存サイト向けの簡単な有効化手段が予定されている。"
