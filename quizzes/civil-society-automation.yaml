title: "社会のために作る: 市民社会組織は Cloudflare で何を自動化しているか"
slug: civil-society-automation
sourceUrl: https://blog.cloudflare.com/civil-society-automation/
wiki: ../docs/articles/2026-10-02-civil-society-automation.md
questions:
  - q: "記事によると、Cloudflare が市民社会組織に提供したクレジットの合計額はいくらか。"
    choices:
      - "250万ドル超"
      - "750万ドル超"
      - "1,000万ドル超"
      - "1億ドル超"
    answer: 1
    explanation: "Wikiの「TL;DR」を参照。数十の市民社会組織が 750 万ドル超のクレジットで開発者サービス上にツールを構築している。1億ドルは別記事（Impact 全体の寄付額）の数字。"

  - q: "記事が述べる、Project Galileo 参加組織のニーズの変化として正しいものはどれか。"
    choices:
      - "既存アプリの保護だけでなく、新しいアプリを作りたいという要望が出てきた"
      - "セキュリティサービスが不要になり、DNS だけを求めるようになった"
      - "AI の利用を完全にやめたいという要望が増えた"
      - "有料プランへの移行を求める声が増えた"
    answer: 0
    explanation: "Wikiの「背景・課題」を参照。『keep us secure』から『help us build』へ、というのが記事の見出しにもなっている変化である。"

  - q: "CIVICUS の調査で、資金面の制約が AI 導入を妨げていると答えた回答者の割合はどれか。"
    choices:
      - "12%"
      - "27%"
      - "48%"
      - "85%"
    answer: 2
    explanation: "Wikiの「背景・課題」を参照。48% が資金面の制約を挙げ、また半数超がプライバシーの懸念を障壁と見ている。"

  - q: "記事で、AI の利用状況の可視化や不要なモデル呼び出しを減らすモデルルーティングを提供するとされている製品はどれか。"
    choices:
      - "Workers AI"
      - "AI Gateway"
      - "Turnstile"
      - "Project Galileo"
    answer: 1
    explanation: "Wikiの「発表内容 / アーキテクチャ」の表を参照。Workers AI は専用 GPU の運用を不要にする役割、AI Gateway がレート制限・可視化・モデルルーティングの役割として説明されている。"

  - q: "第1の非営利スタートアップ・コホートに選ばれた組織数と、各組織に提供されるクレジットの上限の組み合わせとして正しいものはどれか。"
    choices:
      - "10組織、最大5万ドル"
      - "30組織、最大25万ドル"
      - "100組織、最大10万ドル"
      - "30組織、最大100万ドル"
    answer: 1
    explanation: "Wikiの「第1の非営利スタートアップ・コホートと事例」を参照。昨年の Birthday Week で非営利にも開放したプログラムで、1組織あたり最大 25 万ドルのクレジットが提供される。"

  - q: "Kaya Guides が構築したものとして、記事に書かれているものはどれか。"
    choices:
      - "地域の不動産記録を構造化するツール"
      - "WhatsApp ベースのメンタルヘルス支援と、通話中のカウンセラーにリアルタイムでフィードバックする AI システム"
      - "シュノーケリング地点を共有する地図アプリ"
      - "越境弾圧の事例を追跡するダッシュボード"
    answer: 1
    explanation: "Wikiの「第1の非営利スタートアップ・コホートと事例」を参照。不動産記録は LebTown、地図アプリは The Snorkelling Society、越境弾圧は Freedom House の事例。"

  - q: "Freedom House と共同で作っているツールの説明として正しいものはどれか。"
    choices:
      - "完全自動で事例を確定し、人は関与しない"
      - "公開報道から潜在的な事例を取り込み・構造化・フラグ付けする。団体の方法論でファインチューニングされ、全工程に団体が関与する"
      - "各国政府の公式文書のみを入力にする"
      - "利用者の位置情報を収集して活動家を特定する"
    answer: 1
    explanation: "Wikiの「人権団体と一緒に作る自動化ツール」を参照。セキュリティとデータ最小化も設計判断の優先事項とされている。"

  - q: "Global Network Initiative（GNI）向けのダッシュボードが行うこととして、記事に書かれていないものはどれか。"
    choices:
      - "関連するニュース・意見公募・立法の動きの抽出と分類"
      - "提言の機会の推奨"
      - "内部レビューの進捗の追跡と、期限が近いときのスタッフへの通知"
      - "規制当局への意見書の自動提出"
    answer: 3
    explanation: "Wikiの「人権団体と一緒に作る自動化ツール」を参照。ツールは機会の特定・分類・進捗管理・期限通知までで、提出は人が行う前提である。"

  - q: "人権団体との共同開発で、記事が共通して強調している設計方針はどれか。"
    choices:
      - "AI がすべての判断を行い、スタッフの作業をなくす"
      - "AI は情報の構造化や下書きを助け、最終的な判断は人が行う"
      - "データはすべて公開して透明性を確保する"
      - "ツールは一般公開して誰でも使えるようにする"
    answer: 1
    explanation: "Wikiの「所感・ポイント」と「人権団体と一緒に作る自動化ツール」を参照。Article One は「AI は情報の構造化を助けるが、判断はすべて Article One が行う」とされ、Freedom House も全工程に関与する。扱うデータが機微でハルシネーションの影響が重大なことが背景にある。"
