      - "Clef-pro と Clef-lite"
    answer: 0
    explanation: "Wikiの「TL;DR」と「Clef の特徴」を参照。大きい Clef は精度重視、Clef-flash はレイテンシ重視の判断向けで、どちらも Workers AI でホストされる。"

  - q: "記事が述べる、Clef が Jev と異なる点として正しいものはどれか。"
    choices:
      - "画像を入力できる vision encoder を持ち、コンテキストが 64k である"
      - "テキストのみに対応し、コンテキストは 8k である"
